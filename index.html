const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(a+Math.random()*(b-a+1));
const TAU = Math.PI*2;
function dist2(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; }
function dist(x1,y1,x2,y2){ return Math.sqrt(dist2(x1,y1,x2,y2)); }
function rr(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function txt(s,x,y,size,color,align,weight){
  ctx.font = (weight||'')+' '+size+'px "Courier New",Consolas,monospace';
  ctx.fillStyle = color;
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s,x,y);
}
function inRect(mx,my,x,y,w,h){ return mx>=x && mx<=x+w && my>=y && my<=y+h; }
function formatTime(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = Math.floor(sec%60);

}

const Snd = (function(){
  let ac=null, master=null, noiseBuf=null;
  let humOsc=null, humGain=null, humOn=false;
  let sirenOsc=null, sirenLfo=null, sirenGain=null, sirenOn=false;

  function init(){
    if(ac){ if(ac.state==='suspended'){ try{ac.resume();}catch(e){} } return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      ac = new AC();
      master = ac.createGain();
      master.gain.value = settings.volume*0.55;
      master.connect(ac.destination);
      const len = Math.floor(ac.sampleRate*1.5);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ac=null; }
  }
  function setVol(v){ if(master) master.gain.value = v*0.55; }

  function blip(f1,f2,dur,type,g){
    if(!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type||'square';
    o.frequency.setValueAtTime(Math.max(20,f1), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(gn); gn.connect(master);
    o.start(t); o.stop(t+dur+0.03);
  }
  function noiseBurst(dur,g,freq,q){
    if(!ac||!noiseBuf) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type='bandpass';
    f.frequency.value = freq||800; f.Q.value = q||1;
    const gn = ac.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(gn); gn.connect(master);
    s.start(t); s.stop(t+dur+0.02);
  }

  return {
    init, setVol,
    shoot(){ blip(900,220,0.09,'square',0.13); noiseBurst(0.06,0.06,2400,2); },
    turret(){ blip(1400,500,0.05,'square',0.045); },
    hit(){ noiseBurst(0.07,0.10,700,2); },
    kill(){ blip(320,70,0.22,'sawtooth',0.10); noiseBurst(0.16,0.09,420,1); },
    buy(){ blip(620,1240,0.13,'sine',0.14); },
    err(){ blip(190,130,0.16,'square',0.11); },
    click(){ blip(760,760,0.04,'square',0.06); },
    gateBreak(){ blip(210,45,0.55,'sawtooth',0.18); noiseBurst(0.5,0.22,320,0.8); },
    coreHit(){ blip(140,60,0.3,'sawtooth',0.16); noiseBurst(0.25,0.14,260,0.9); },
    heartbeat(){ blip(62,40,0.16,'sine',0.30); setTimeout(()=>{ blip(56,36,0.18,'sine',0.22); }, 150); },
    alarmBeep(){ blip(880,880,0.10,'square',0.07); },
    artifact(){ blip(880,1760,0.25,'sine',0.16); blip(1320,2640,0.22,'sine',0.10); },
    dialog(){ blip(520,520,0.06,'sine',0.06); },
    projectile(){ blip(320,180,0.08,'sawtooth',0.06); },
    allyShot(){ blip(680,340,0.06,'triangle',0.07); },

    startHum(){
      if(!ac||humOn) return;
      humOsc = ac.createOscillator(); humOsc.type='sawtooth'; humOsc.frequency.value=47;
      const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=150;
      humGain = ac.createGain(); humGain.gain.value=0.0001;
      humOsc.connect(f); f.connect(humGain); humGain.connect(master);
      humOsc.start();
      humGain.gain.linearRampToValueAtTime(0.055, ac.currentTime+1.2);
      humOn = true;
    },
    stopHum(){
      if(!humOsc) return;
      try{ humOsc.stop(ac.currentTime+0.2); }catch(e){}
      humOsc=null; humOn=false;
    },
    startSiren(){
      if(!ac||sirenOn) return;
      sirenOsc = ac.createOscillator(); sirenOsc.type='sawtooth'; sirenOsc.frequency.value=540;
      sirenLfo = ac.createOscillator(); sirenLfo.type='sine'; sirenLfo.frequency.value=0.8;
      const lg = ac.createGain(); lg.gain.value=170;
      sirenLfo.connect(lg); lg.connect(sirenOsc.frequency);
      sirenGain = ac.createGain(); sirenGain.gain.value=0.0001;
      sirenOsc.connect(sirenGain); sirenGain.connect(master);
      sirenOsc.start(); sirenLfo.start();
      sirenGain.gain.linearRampToValueAtTime(0.045, ac.currentTime+0.6);
      sirenOn = true;
    },
    stopSiren(){
      if(!sirenOsc) return;
      try{ sirenOsc.stop(ac.currentTime+0.3); sirenLfo.stop(ac.currentTime+0.3); }catch(e){}
      sirenOsc=null; sirenLfo=null; sirenOn=false;
    },
    silenceAll(){ this.stopHum(); this.stopSiren(); }
  };
})();

function addArtifact(g, type){
  if(!g || g.artifacts.length >= g.maxArtifacts) return false;
  if(g.artifacts.indexOf(type) >= 0) return false;
  g.artifacts.push(type);
  // применить бонус
  if(type==='capacitor') g.bonus.energyRegen += 0.6;
  if(type==='amplifier') g.bonus.turretDmg += 0.25;
  if(type==='shield')    g.bonus.coreArmor += 0.20;
  if(type==='stimulant') g.bonus.oxyBoost += 0.35;
  if(type==='resonator') g.bonus.enemySlow += 0.15;
  return true;
}

function spawnParticle(x,y,vx,vy,life,size,color,shape,glow,gravity){
  for(let i=0;i<particlePool.length;i++){
    const p = particlePool[i];
    if(!p.active){
      p.active=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy;
      p.life=life; p.maxLife=life; p.size=size; p.color=color; p.drag=0.94;
      p.shape = shape||0;
      p.rot = Math.random()*TAU;
      p.rotSpeed = rnd(-8,8);
      p.glow = glow||false;
      p.gravity = gravity||0;
      return;
    }
  }
}
function burst(x,y,n,color,power,size,shape,glow,gravity){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU;
    const s = rnd(power*0.25, power);
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(0.25,0.85),rnd(size*0.5,size),color,shape,glow,gravity);
  }
}
function ringBurst(x,y,n,color,radius,speed,size,glow){
  for(let i=0;i<n;i++){
    const a = i/n*TAU;
    spawnParticle(x,y,Math.cos(a)*speed,Math.sin(a)*speed,rnd(0.5,0.9),size,color,0,glow,0);
  }
}
function spawnBeam(x1,y1,x2,y2,color,width,life){
  for(let i=0;i<beamPool.length;i++){
    const b = beamPool[i];
    if(!b.active){
      b.active=true; b.x1=x1; b.y1=y1; b.x2=x2; b.y2=y2;
      b.color=color; b.width=width||2; b.life=life||0.14; b.maxLife=b.life;
      return;
    }
  }
}
function spawnProj(x,y,vx,vy,dmg,color,size,target,gateId,fromAlly){
  for(let i=0;i<projPool.length;i++){
    const p = projPool[i];
    if(!p.active){
      p.active=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy;
      p.life=3.5; p.dmg=dmg; p.color=color; p.size=size||4;
      p.target = target||'core'; p.gateId = gateId||'';
      p.fromAlly = fromAlly||false;
      return;
    }
  }
}

function drawPipes(c, x1,y1,x2,y2, color, width){
  // тень
  c.strokeStyle = 'rgba(0,0,0,0.4)';
  c.lineWidth = width+3;
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  // труба
  c.strokeStyle = color;
  c.lineWidth = width;
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  // блик
  c.strokeStyle = 'rgba(255,255,255,0.18)';
  c.lineWidth = width*0.35;
  c.beginPath(); c.moveTo(x1,y1-1); c.lineTo(x2,y2-1); c.stroke();
}

function drawCorridor(c, room){
  const cx = room.x + room.w/2, cy = room.y + room.h/2;
  // тень коридора
  c.strokeStyle = 'rgba(0,0,0,0.6)';
  c.lineWidth = 58;
  c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x, CORE.y); c.stroke();
  // основа
  c.strokeStyle = '#0d141c';
  c.lineWidth = 52;
  c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x, CORE.y); c.stroke();
  // верхний блик
  c.strokeStyle = 'rgba(60,140,180,0.14)';
  c.lineWidth = 44;
  c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x, CORE.y); c.stroke();
}

function drawRoomDecor(c, room, id){
  // внутренние панели
  c.strokeStyle = 'rgba(40,80,110,0.22)';
  c.lineWidth = 1;
  for(let gx=room.x+20; gx<room.x+room.w-6; gx+=20){
    c.beginPath(); c.moveTo(gx+0.5, room.y+6); c.lineTo(gx+0.5, room.y+room.h-6); c.stroke();
  }
  for(let gy=room.y+20; gy<room.y+room.h-6; gy+=20){
    c.beginPath(); c.moveTo(room.x+6, gy+0.5); c.lineTo(room.x+room.w-6, gy+0.5); c.stroke();
  }

  // ящики
  const crateCols = ['#3a3020','#2a2010','#403520'];
  for(let i=0;i<2;i++){
    const cx = room.x + 16 + i*26;
    const cy = room.y + room.h - 40;
    const cw = 20, ch = 20;
    c.fillStyle = crateCols[i%3];
    c.fillRect(cx, cy, cw, ch);
    c.strokeStyle = 'rgba(90,70,40,0.7)';
    c.lineWidth = 1;
    c.strokeRect(cx+0.5, cy+0.5, cw-1, ch-1);
    c.strokeStyle = 'rgba(90,70,40,0.5)';
    c.beginPath();
    c.moveTo(cx+3, cy+3); c.lineTo(cx+cw-3, cy+ch-3);
    c.moveTo(cx+cw-3, cy+3); c.lineTo(cx+3, cy+ch-3);
    c.stroke();
  }

  // терминалы
  if(id === 'core' || id === 'gen' || id === 'oxy' || id === 'lab'){
    for(let i=0;i<2;i++){
      const tx = room.x + room.w - 30 - i*22;
      const ty = room.y + 20;
      const tw = 16, th = 22;
      c.fillStyle = '#0e1a26';
      c.fillRect(tx, ty, tw, th);
      c.strokeStyle = 'rgba(90,180,220,0.6)';
      c.lineWidth = 1;
      c.strokeRect(tx+0.5, ty+0.5, tw-1, th-1);
      c.fillStyle = 'rgba(90,220,255,0.7)';
      c.fillRect(tx+3, ty+4, tw-6, 2);
      c.fillRect(tx+3, ty+8, tw-6, 2);
      c.fillRect(tx+3, ty+12, tw-6, 2);
    }
  }

  // предупреждающие полосы
  if(id === 'gen' || id === 'vent' || id === 'gateA' || id === 'gateB' || id === 'gateC'){
    const sy = room.y + room.h - 12;
    c.fillStyle = 'rgba(255,180,60,0.5)';
    for(let i=0;i<Math.floor(room.w/10);i++){
      c.fillRect(room.x + 8 + i*10, sy, 5, 4);
    }
  }
}

function buildBackground(){
  const c = bgCtx;
  c.fillStyle = '#04060a';
  c.fillRect(0,0,VW,VH);

  // общий фон-сетка
  c.strokeStyle = 'rgba(30,64,88,0.10)';
  c.lineWidth = 1;
  c.beginPath();
  for(let x=0;x<=VW;x+=40){ c.moveTo(x+0.5,0); c.lineTo(x+0.5,VH); }
  for(let y=0;y<=VH;y+=40){ c.moveTo(0,y+0.5); c.lineTo(VW,y+0.5); }
  c.stroke();

  // коридоры
  for(const id in ROOMS) drawCorridor(c, ROOMS[id]);

  // трубы вдоль коридоров (декоративные)
  for(const id in ROOMS){
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    const mx = (cx + CORE.x)/2 + (cy-CORE.y)*0.15;
    const my = (cy + CORE.y)/2 - (cx-CORE.x)*0.15;
    c.strokeStyle = 'rgba(80,140,160,0.18)';
    c.lineWidth = 2;
    c.setLineDash([6,8]);
    c.beginPath();
    c.moveTo(cx, cy);
    c.quadraticCurveTo(mx, my, CORE.x, CORE.y);
    c.stroke();
    c.setLineDash([]);
  }

  // комнаты
  for(const id in ROOMS){
    const r = ROOMS[id];

    // тень комнаты
    c.save();
    c.shadowColor = 'rgba(0,0,0,0.7)';
    c.shadowBlur = 12;
    c.shadowOffsetY = 3;

    // основа
    c.fillStyle = '#0b111a';
    rr(c, r.x, r.y, r.w, r.h, 6); c.fill();

    c.restore();

    // верхняя подсветка
    const grad = c.createLinearGradient(0, r.y, 0, r.y+r.h);
    grad.addColorStop(0, 'rgba(60,130,170,0.06)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.25)');
    c.fillStyle = grad;
    rr(c, r.x, r.y, r.w, r.h, 6); c.fill();

    // рамка
    c.strokeStyle = 'rgba(44,84,110,0.85)';
    c.lineWidth = 2;
    rr(c, r.x, r.y, r.w, r.h, 6); c.stroke();

    // угловые засечки
    c.strokeStyle = 'rgba(90,190,230,0.55)';
    c.lineWidth = 2;
    const t = 14;
    c.beginPath();
    c.moveTo(r.x+4, r.y+4+t); c.lineTo(r.x+4, r.y+4); c.lineTo(r.x+4+t, r.y+4);
    c.moveTo(r.x+r.w-4-t, r.y+4); c.lineTo(r.x+r.w-4, r.y+4); c.lineTo(r.x+r.w-4, r.y+4+t);
    c.moveTo(r.x+4, r.y+r.h-4-t); c.lineTo(r.x+4, r.y+r.h-4); c.lineTo(r.x+4+t, r.y+r.h-4);
    c.moveTo(r.x+r.w-4-t, r.y+r.h-4); c.lineTo(r.x+r.w-4, r.y+r.h-4); c.lineTo(r.x+r.w-4, r.y+r.h-4-t);
    c.stroke();

    // декор
    drawRoomDecor(c, r, id);

    // заголовок
    c.font = 'bold 10px "Courier New",monospace';
    c.fillStyle = 'rgba(110,180,220,0.75)';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(r.name, r.x+r.w/2, r.y+10);
  }

  // центральные декоративные трубы
  drawPipes(c, CORE.x-180, 60, CORE.x-180, 250, 'rgba(90,110,130,0.35)', 6);
  drawPipes(c, CORE.x+180, 60, CORE.x+180, 250, 'rgba(90,110,130,0.35)', 6);
  drawPipes(c, CORE.x-140, 560, CORE.x-140, 660, 'rgba(90,110,130,0.3)', 5);
  drawPipes(c, CORE.x+140, 560, CORE.x+140, 660, 'rgba(90,110,130,0.3)', 5);
}

const vignetteCanvas = document.createElement('canvas');

(function(){

  const g = v.createRadialGradient(VW/2,VH/2, Math.min(VW,VH)*0.35, VW/2,VH/2, Math.max(VW,VH)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.55)');
  v.fillStyle = g; v.fillRect(0,0,VW,VH);
})();

let glitchTimer = 0, glitchY = 0, glitchH = 0;

function drawCRTOverlay(alpha){
  ctx.save();
  ctx.fillStyle = scanPattern;
  ctx.fillRect(0,0,VW,VH);

  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = alpha===undefined?0.35:alpha;
  ctx.drawImage(noiseCanvas,0,0,VW,VH);
  ctx.imageSmoothingEnabled = true;

  // глюки
  glitchTimer -= 0.016;
  if(glitchTimer <= 0){
    glitchTimer = rnd(1.5, 4.5);
    if(Math.random() < 0.4){
      glitchY = rnd(0, VH-40);
      glitchH = rnd(4, 30);
    } else { glitchH = 0; }
  }
  if(glitchH > 0){
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#5ad1ff';
    ctx.fillRect(0, glitchY, VW, glitchH);
    ctx.fillStyle = 'rgba(255,90,122,0.4)';
    ctx.fillRect(rnd(-10,10), glitchY, VW, glitchH);
  }
  ctx.globalAlpha = 1;

  // виньетка
  ctx.drawImage(vignetteCanvas, 0, 0);
  ctx.restore();
}

function startGame(mode){
  game = newGame(mode);
  screen = 'game';
  Snd.init();
  Snd.startHum();
  if(mode==='hardcore') Snd.startSiren();
}
function finishGame(win){
  if(!game || game.over) return;
  game.over = true;
  game.victory = win;
  Snd.silenceAll();
  if(game.mode==='endless'){
    const b = bestRecord();
    if(game.time > b) Store.set('best', game.time);
  }
  screen = win ? 'victory' : 'over';
}

function pickEnemyType(prog){
  const r = Math.random();
  if(prog < 0.15) return r<0.85 ? 'parasite':'drone';
  if(prog < 0.32) return r<0.55?'parasite':(r<0.75?'crawler':(r<0.92?'drone':'stealth'));
  if(prog < 0.55) return r<0.35?'parasite':(r<0.55?'crawler':(r<0.72?'drone':(r<0.88?'stealth':'shooter')));
  if(prog < 0.78) return r<0.22?'parasite':(r<0.40?'crawler':(r<0.58?'drone':(r<0.74?'stealth':(r<0.88?'shooter':'brute'))));
  return r<0.15?'parasite':(r<0.30?'crawler':(r<0.48?'drone':(r<0.64?'stealth':(r<0.82?'shooter':'brute'))));
}

function spawnEnemy(){
  const G = game;
  let e = null;
  for(let i=0;i<enemyPool.length;i++){ if(!enemyPool[i].active){ e = enemyPool[i]; break; } }
  if(!e) return;

  const type = pickEnemyType(G.progress);
  const def = ENEMY_DEFS[type];
  const gateId = GATE_IDS[rndi(0,3)];
  const gd = GATE_DATA[gateId];

  let hpMul = 1 + G.progress*0.9;
  let spMul = 1;
  if(G.mode==='hardcore'){ hpMul *= 1.28; spMul = 1.30; }

  e.active = true;
  e.type = type;
  e.x = gd.spawn.x + rnd(-10,10);
  e.y = gd.spawn.y + rnd(-10,10);
  e.hp = def.hp * hpMul;
  e.maxHp = e.hp;
  e.speed = def.speed * spMul * rnd(0.9,1.12);
  e.dmg = def.dmg;
  e.atk = def.atk;
  e.atkCd = rnd(0,0.4);
  e.size = def.size;
  e.color = def.color;
  e.reward = def.reward;
  e.gateId = gateId;
  e.inside = false;
  e.angle = 0;
  e.anim = Math.random()*TAU;
  e.flash = 0;
  e.slow = 0;
  e.spawnT = 0.25;
  e.cloaked = false;
  e.cloakT = type==='stealth' ? rnd(1.0,2.0) : 0;
  e.zigzag = !!def.zigzag;
  e.ranged = !!def.ranged;
  e.range = def.range || 0;
  e.zigPhase = Math.random()*TAU;
  e.zigDir = Math.random()<0.5?1:-1;

  // swarm спавн для краулера
  if(def.swarm && Math.random() < 0.55){
    for(let k=0;k<2;k++){
      let e2 = null;
      for(let i=0;i<enemyPool.length;i++){ if(!enemyPool[i].active){ e2 = enemyPool[i]; break; } }
      if(!e2) break;
      e2.active = true; e2.type = type;
      e2.x = e.x + rnd(-16,16); e2.y = e.y + rnd(-16,16);
      e2.hp = def.hp*hpMul; e2.maxHp = e2.hp;
      e2.speed = def.speed*spMul*rnd(0.9,1.1);
      e2.dmg = def.dmg; e2.atk = def.atk; e2.atkCd = rnd(0,0.4);
      e2.size = def.size; e2.color = def.color; e2.reward = def.reward;
      e2.gateId = gateId; e2.inside = false; e2.angle = 0;
      e2.anim = Math.random()*TAU; e2.flash = 0; e2.slow = 0; e2.spawnT = 0.25;
      e2.cloaked = false; e2.cloakT = 0;
      e2.zigzag = true; e2.ranged = false; e2.range = 0;
      e2.zigPhase = Math.random()*TAU; e2.zigDir = Math.random()<0.5?1:-1;
    }
  }
}

function damageEnemy(e, dmg, splashColor){
  if(!e.active) return;
  e.hp -= dmg;
  e.flash = 0.12;
  burst(e.x, e.y, 3, splashColor||e.color, 90, 2.2, 0, true, 40);
  if(e.hp <= 0){
    killEnemy(e);
  } else {
    Snd.hit();
  }
}

function killEnemy(e){
  const G = game;
  e.active = false;
  G.credits += e.reward;
  G.stats.kills++;
  burst(e.x, e.y, 18, e.color, 200, 3.5, 0, true, 60);
  burst(e.x, e.y, 8, '#ffffff', 150, 2.2, 1, true, 20);
  Snd.kill();

  // шанс дропа артефакта
  if(Math.random() < 0.08 && G.floatingArtifacts.length < 6 && G.artifacts.length < G.maxArtifacts){
    const type = ARTIFACT_KEYS[rndi(0, ARTIFACT_KEYS.length-1)];
    G.floatingArtifacts.push({ x:e.x, y:e.y, type, anim:0 });
  }
}

function fireAt(tx,ty){
  const G = game;
  if(!G || G.over) return;
  if(G.fireCd > 0) return;
  const w = WEAPONS[G.weapon];
  if(G.energy < w.cost){ Snd.err(); return; }

  G.energy -= w.cost;
  G.stats.energySpent += w.cost;
  G.fireCd = w.cd;

  spawnBeam(CORE.x, CORE.y, tx, ty, w.color, w.id==='plasma'?4:2, 0.13);
  burst(tx, ty, 5, w.color, 130, 2.4, 0, true, 30);
  Snd.shoot();

  let best = null, bestD = 26*26;
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active || e.cloaked) continue;
    const d = dist2(e.x,e.y,tx,ty);
    if(d < bestD){ bestD = d; best = e; }
  }
  if(best){
    damageEnemy(best, w.dmg, w.color);
    if(w.id==='plasma'){
      for(let i=0;i<enemyPool.length;i++){
        const e = enemyPool[i];
        if(!e.active || e===best) continue;
        if(dist2(e.x,e.y,best.x,best.y) < 55*55) damageEnemy(e, w.dmg*0.45, w.color);
      }
      burst(best.x,best.y,14,w.color,220,3,0,true,0);
      ringBurst(best.x,best.y,16,w.color,55,120,2.4,true);
    }
    if(w.id==='emp'){
      best.slow = Math.max(best.slow, 1.6);
    }
  }
}

function repairGates(){
  const G = game;
  if(!G || G.over) return;
  if(G.repairCd > 0){ Snd.err(); return; }
  if(G.energy < 30){ Snd.err(); return; }
  G.energy -= 30;
  G.stats.energySpent += 30;
  G.stats.repairs++;
  G.repairCd = 1.0;
  for(const id of GATE_IDS){
    const g = G.gates[id];
    if(g.hp > 0) g.hp = clamp(g.hp + 26, 0, g.max);
  }
  Snd.buy();
  for(const id of GATE_IDS){
    const gd = GATE_DATA[id];
    burst(gd.cx, gd.cy, 10, '#4affd0', 100, 2.5, 0, true, 20);
  }
}

function boostOxygen(){
  const G = game;
  if(!G || G.over) return;
  if(G.oxygenCd > 0){ Snd.err(); return; }
  if(G.energy < 16){ Snd.err(); return; }
  G.energy -= 16;
  G.stats.energySpent += 16;
  const amt = 22 * (1 + G.bonus.oxyBoost);
  G.oxygen = clamp(G.oxygen + amt, 0, 100);
  G.oxygenCd = 1.2;
  const r = ROOMS.oxy;
  burst(r.x+r.w/2, r.y+r.h/2, 16, '#4affd0', 130, 3, 0, true, -20);
  Snd.buy();
}

function rebootEnergy(){
  const G = game;
  if(!G || G.over) return;
  if(G.rebootCd > 0){ Snd.err(); return; }
  G.energy = clamp(G.energy + 34, 0, G.energyMax);
  G.oxygen = clamp(G.oxygen - 6, 0, 100);
  G.rebootCd = 18;
  const r = ROOMS.gen;
  burst(r.x+r.w/2, r.y+r.h/2, 24, '#ffcf4a', 180, 3.2, 0, true, 30);
  Snd.buy();
}

function cycleWeapon(dir){
  const G = game;
  if(!G) return;
  let idx = G.weapon;
  for(let i=0;i<4;i++){
    idx = (idx + dir + 4) % 4;
    if(G.unlocked[idx]){ G.weapon = idx; Snd.click(); return; }
  }
}

function openDialog(allyId){
  const G = game;
  if(!G) return;
  const def = ALLIES_DEF.find(a=>a.id===allyId);
  if(!def) return;
  const ally = G.allies.find(a=>a.id===allyId);
  const firstMeet = !ally.met;
  if(firstMeet){
    ally.met = true;
    Snd.dialog();
    // применить бонус
    def.bonus(G);
    G.floatingArtifacts.push({ x:CORE.x-180, y:CORE.y+120, type:'_bonus', anim:0, text:def.bonusText });
  }
  G.dialog = { allyId, def, page:0 };
  screen = 'dialog';
}

function advanceDialog(){
  const G = game;
  if(!G || !G.dialog) return;
  G.dialog.page++;
  Snd.dialog();
  if(G.dialog.page >= G.dialog.def.dialogs.length){
    G.dialog = null;
    screen = 'game';
  }
}

function buyTurret(gateId){
  const G = game;
  if(G.turrets.some(t=>t.gateId===gateId)) return false;
  const cost = 175;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  const s = TURRET_SLOTS[gateId];
  G.turrets.push({ gateId, x:s.x, y:s.y, cd:0, angle:0 });
  Snd.buy();
  return true;
}
function buyLaser(gateId){
  const G = game;
  const lv = G.lasers.filter(l=>l.gateId===gateId).length;
  if(lv >= 3) return false;
  const cost = 115 + lv*45;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  G.lasers.push({ gateId, cd:0 });
  Snd.buy();
  return true;
}
function buyBlocker(){
  const G = game;
  if(G.blocker) return false;
  const cost = 160;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  G.blocker = true;
  Snd.buy();
  return true;
}
function buyWeapon(i){
  const G = game;
  if(G.unlocked[i]) return false;
  const cost = WEAPONS[i].price;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  G.unlocked[i] = true;
  G.weapon = i;
  Snd.buy();
  return true;
}
function buyUpgrade(key){
  const G = game;
  if(key==='gen'){
    if(G.upgrades.gen >= 3) return false;
    const cost = [230, 400, 640][G.upgrades.gen];
    if(G.credits < cost){ Snd.err(); return false; }
    G.credits -= cost; G.stats.spent += cost;
    G.upgrades.gen++;
    G.stats.upgradesBought++;
    Snd.buy(); return true;
  }
  if(key==='autoRepair'){
    if(G.upgrades.autoRepair > 0) return false;
    const cost = 350;
    if(G.credits < cost){ Snd.err(); return false; }
    G.credits -= cost; G.stats.spent += cost;
    G.upgrades.autoRepair = 1;
    G.stats.upgradesBought++;
    Snd.buy(); return true;
  }
  if(key==='scanner'){
    if(G.upgrades.scanner > 0) return false;
    const cost = 190;
    if(G.credits < cost){ Snd.err(); return false; }
    G.credits -= cost; G.stats.spent += cost;
    G.upgrades.scanner = 1;
    G.stats.upgradesBought++;
    Snd.buy(); return true;
  }
  return false;
}
function getShopItems(){
  const G = game;
  const items = [];
  for(const gid of GATE_IDS){
    const owned = G.turrets.some(t=>t.gateId===gid);
    items.push({ name:'ТУРЕЛЬ «СТРАЖ»', sub:ROOMS[gid].name, price:175, owned, cat:'ТУРЕЛИ',
      buy:()=>buyTurret(gid) });
  }
  for(const gid of ['gateA','gateB','gateC']){
    const lv = G.lasers.filter(l=>l.gateId===gid).length;
    items.push({ name:'ЛАЗЕРНАЯ РАСТЯЖКА', sub:ROOMS[gid].name+' ['+lv+'/3]',
      price:115+lv*45, owned:lv>=3, cat:'ЛОВУШКИ', buy:()=>buyLaser(gid) });
  }
  items.push({ name:'ЭЛЕКТРОБЛОКИРАТОР', sub:'Замедляет врагов у шлюзов',
    price:160, owned:G.blocker, cat:'ЛОВУШКИ', buy:()=>buyBlocker() });
  for(let i=1;i<WEAPONS.length;i++){
    items.push({ name:WEAPONS[i].name, sub:'Урон '+WEAPONS[i].dmg+' / заряд '+WEAPONS[i].cost,
      price:WEAPONS[i].price, owned:G.unlocked[i], cat:'ОРУЖИЕ', buy:()=>buyWeapon(i) });
  }
  items.push({ name:'МОЩНОСТЬ ГЕНЕРАТОРА', sub:'Уровень '+G.upgrades.gen+'/3',
    price:[230,400,640][G.upgrades.gen]||0, owned:G.upgrades.gen>=3, cat:'СИСТЕМЫ',
    buy:()=>buyUpgrade('gen') });
  items.push({ name:'АВТО-РЕМОНТ ШЛЮЗОВ', sub:G.upgrades.autoRepair?'Активно':'Пассивный ремонт',
    price:350, owned:G.upgrades.autoRepair>0, cat:'СИСТЕМЫ', buy:()=>buyUpgrade('autoRepair') });
  items.push({ name:'СКАНЕРЫ ДВИЖЕНИЯ', sub:'Показ прочности целей',
    price:190, owned:G.upgrades.scanner>0, cat:'СИСТЕМЫ', buy:()=>buyUpgrade('scanner') });
  return items;
}

/* ============================================================
   ОБНОВЛЕНИЕ ИГРЫ
   ============================================================ */
function updateGame(dt){
  const G = game;
  if(!G || G.over) return;

  G.time += dt;

  const totalMin = G.time/60;
  const hour = (22 + Math.floor(totalMin)) % 24;
  const minute = Math.floor((totalMin % 1)*60);
  G.clock = (hour<10?'0':'')+hour+':'+(minute<10?'0':'')+minute;

  let prog;
  if(G.mode==='endless') prog = Math.min(1, G.time/620);
  else prog = Math.min(1, G.time/480);
  G.progress = prog;
  G.danger = 1 + Math.floor(prog*9);
  G.wave = 1 + Math.floor(G.time/45);

  if(G.mode!=='endless' && G.time >= 480){ finishGame(true); return; }

  if(G.fireCd > 0) G.fireCd -= dt;
  if(G.rebootCd > 0) G.rebootCd -= dt;
  if(G.repairCd > 0) G.repairCd -= dt;
  if(G.oxygenCd > 0) G.oxygenCd -= dt;
  if(G.allyShootCd > 0) G.allyShootCd -= dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*22);
  if(G.flashRed > 0) G.flashRed = Math.max(0, G.flashRed - dt*2.4);

  // энергия
  let regen = 4.2 + G.upgrades.gen*1.6 + G.bonus.energyRegen;
  if(G.mode==='hardcore') regen *= 0.5;
  let drain = 0.85 + G.turrets.length*0.62 + G.lasers.length*0.28 + (G.blocker?0.35:0);
  G.energy = clamp(G.energy + (regen - drain)*dt, 0, G.energyMax);

  // кислород
  let oxyDrain = G.mode==='hardcore' ? 0.44 : 0.30;
  if(G.energy <= 1) oxyDrain += 1.1;
  G.oxygen -= oxyDrain*dt;
  G.oxygen = clamp(G.oxygen, 0, 100);
  if(G.oxygen <= 0){
    G.coreHP -= 5.5*dt;
    G.flashRed = Math.min(1, G.flashRed + dt*2);
  }

  // авто-ремонт
  if(G.upgrades.autoRepair > 0){
    for(const id of GATE_IDS){
      const g = G.gates[id];
      if(g.hp > 0 && g.hp < g.max) g.hp = clamp(g.hp + 1.4*dt, 0, g.max);
    }
  }

  // спавн врагов
  G.spawnTimer -= dt;
  if(G.spawnTimer <= 0){
    spawnEnemy();
    let base = G.mode==='hardcore' ? 2.15 : 2.95;
    let interval = lerp(base, 0.78, prog) * rnd(0.72,1.28);
    if(G.mode==='hardcore') interval *= 0.78;
    G.spawnTimer = Math.max(0.45, interval);
  }

  // союзник-стрелок (Виктор помогает)
  const engineer = G.allies.find(a=>a.id==='engineer');
  if(engineer && engineer.met && G.allyShootCd <= 0){
    // инженер изредка стреляет по врагам у вентиляции
    let target = null, bd = 200*200;
    for(let i=0;i<enemyPool.length;i++){
      const e = enemyPool[i];
      if(!e.active || e.cloaked) continue;
      const d = dist2(e.x,e.y,engineer.x,engineer.y);
      if(d < bd){ bd = d; target = e; }
    }
    if(target){
      G.allyShootCd = 1.8;
      spawnBeam(engineer.x, engineer.y, target.x, target.y, '#ffcf4a', 1.5, 0.1);
      damageEnemy(target, 8, '#ffcf4a');
      Snd.allyShot();
    }
  }

  // враги
  const coreStop = 84;
  const globalSlow = 1 - G.bonus.enemySlow;
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active) continue;

    e.anim += dt;
    if(e.flash > 0) e.flash -= dt;
    if(e.slow > 0) e.slow -= dt;
    if(e.spawnT > 0){ e.spawnT -= dt; }

    if(e.type === 'stealth'){
      e.cloakT -= dt;
      if(e.cloakT <= 0){
        e.cloaked = !e.cloaked;
        e.cloakT = e.cloaked ? rnd(1.1,1.8) : rnd(2.2,3.2);
      }
    }

    const gd = GATE_DATA[e.gateId];
    const gate = G.gates[e.gateId];
    const spd = e.speed * (e.slow>0 ? 0.45 : 1) * globalSlow;

    // ranged enemy — стреляет с дистанции
    if(e.ranged && !e.inside){
      const dToCore = dist(e.x, e.y, CORE.x, CORE.y);
      if(dToCore < e.range){
        e.atkCd -= dt;
        if(e.atkCd <= 0){
          e.atkCd = e.atk;
          const a = Math.atan2(CORE.y-e.y, CORE.x-e.x);
          spawnProj(e.x, e.y, Math.cos(a)*300, Math.sin(a)*300, 12, e.color, 5, 'core', '', false);
          Snd.projectile();
        }
        // отход на дистанцию
        continue;
      }
    }

    let tx, ty, targetKind;
    if(!e.inside){
      if(gate.hp > 0){
        tx = gd.breach.x; ty = gd.breach.y; targetKind = 'gate';
      } else {
        e.inside = true;
        targetKind = 'core';
        tx = CORE.x; ty = CORE.y;
      }
    } else {
      targetKind = 'core';
      tx = CORE.x; ty = CORE.y;
    }

    if(targetKind === 'core'){
      const d = dist(e.x,e.y,CORE.x,CORE.y);
      if(d <= coreStop){
        e.atkCd -= dt;
        if(e.atkCd <= 0){
          e.atkCd = e.atk;
          const dmg = e.dmg * (1 - G.bonus.coreArmor*0.5);
          G.coreHP -= dmg;
          G.shake = Math.min(9, G.shake + 2.2);
          G.flashRed = Math.min(1, G.flashRed + 0.35);
          burst(e.x, e.y, 6, '#ff4a4a', 140, 2.6, 0, true, 30);
          Snd.coreHit();
          if(G.coreHP <= 0){ G.coreHP = 0; finishGame(false); return; }
        }
      } else {
        const dx = CORE.x-e.x, dy = CORE.y-e.y;
        let nx = dx/d, ny = dy/d;
        if(e.zigzag){
          e.zigPhase += dt*6;
          const pn = Math.sin(e.zigPhase)*0.6;
          const px = -ny, py = nx;
          nx += px*pn; ny += py*pn;
          const nl = Math.sqrt(nx*nx+ny*ny); nx/=nl; ny/=nl;
        }
        const step = Math.min(d - coreStop, spd*dt);
        e.x += nx*step; e.y += ny*step;
        e.angle = Math.atan2(ny,nx);
      }
    } else {
      const d = dist(e.x,e.y,tx,ty);
      if(d <= 3){
        e.atkCd -= dt;
        if(e.atkCd <= 0){
          e.atkCd = e.atk;
          let dmg = e.dmg;
          if(G.blocker) dmg *= 0.55;
          gate.hp -= dmg;
          burst(e.x, e.y, 4, '#ffae4a', 110, 2.2, 0, true, 20);
          Snd.hit();
          if(gate.hp <= 0){
            gate.hp = 0;
            if(!gate.broken){
              gate.broken = true;
              Snd.gateBreak();
              G.shake = 12;
              burst(gd.cx, gd.cy, 28, '#ff5a3b', 240, 3.5, 0, true, 50);
            }
          }
        }
      } else {
        const dx = tx-e.x, dy = ty-e.y;
        let nx = dx/d, ny = dy/d;
        if(e.zigzag){
          e.zigPhase += dt*6;
          const pn = Math.sin(e.zigPhase)*0.6;
          const px = -ny, py = nx;
          nx += px*pn; ny += py*pn;
          const nl = Math.sqrt(nx*nx+ny*ny); nx/=nl; ny/=nl;
        }
        const step = Math.min(d, spd*dt);
        e.x += nx*step; e.y += ny*step;
        e.angle = Math.atan2(ny,nx);
      }
    }

    if(G.blocker && !e.inside) e.slow = Math.max(e.slow, 0.1);
  }

  // восстановление шлюзов
  for(const id of GATE_IDS){
    const g = G.gates[id];
    if(g.hp > 0 && g.broken) g.broken = false;
  }

  // турели
  const turretDmgMul = 1 + G.bonus.turretDmg;
  for(let i=0;i<G.turrets.length;i++){
    const t = G.turrets[i];
    t.cd -= dt;
    if(t.cd > 0) continue;
    let best = null, bestD = 320*320;
    for(let j=0;j<enemyPool.length;j++){
      const e = enemyPool[j];
      if(!e.active || e.cloaked) continue;
      const d = dist2(e.x,e.y,t.x,t.y);
      if(d < bestD){ bestD = d; best = e; }
    }
    if(best && G.energy >= 1.6){
      t.cd = 0.42;
      t.angle = Math.atan2(best.y-t.y, best.x-t.x);
      G.energy -= 1.6;
      spawnBeam(t.x, t.y, best.x, best.y, '#7fe9ff', 1.6, 0.1);
      damageEnemy(best, 13*turretDmgMul, '#7fe9ff');
      Snd.turret();
    }
  }

  // лазеры
  for(let i=0;i<G.lasers.length;i++){
    const l = G.lasers[i];
    l.cd -= dt;
    if(l.cd > 0) continue;
    l.cd = 0.55;
    const gd = GATE_DATA[l.gateId];
    for(let j=0;j<enemyPool.length;j++){
      const e = enemyPool[j];
      if(!e.active) continue;
      if(dist2(e.x,e.y,gd.breach.x,gd.breach.y) < 90*90){
        damageEnemy(e, 9, '#ff4a9a');
      }
    }
    burst(gd.breach.x, gd.breach.y, 4, '#ff4a9a', 80, 2, 0, true, 0);
  }

  // снаряды
  for(let i=0;i<projPool.length;i++){
    const p = projPool[i];
    if(!p.active) continue;
    p.life -= dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    if(p.life <= 0 || p.x < -20 || p.x > VW+20 || p.y < -20 || p.y > VH+20){
      p.active = false; continue;
    }
    // столкновение
    if(p.target === 'core'){
      if(dist2(p.x,p.y,CORE.x,CORE.y) < 30*30){
        G.coreHP -= p.dmg * (1 - G.bonus.coreArmor*0.5);
        G.shake = Math.min(9, G.shake + 1.5);
        burst(p.x, p.y, 8, p.color, 140, 2.6, 0, true, 0);
        Snd.coreHit();
        p.active = false;
        if(G.coreHP <= 0){ G.coreHP = 0; finishGame(false); return; }
      }
    } else if(p.target === 'gate' && p.gateId){
      const gd = GATE_DATA[p.gateId];
      if(dist2(p.x,p.y,gd.breach.x,gd.breach.y) < 40*40){
        G.gates[p.gateId].hp -= p.dmg;
        burst(p.x, p.y, 6, p.color, 120, 2.4, 0, true, 0);
        Snd.hit();
        p.active = false;
        if(G.gates[p.gateId].hp <= 0){
          G.gates[p.gateId].hp = 0;
          if(!G.gates[p.gateId].broken){
            G.gates[p.gateId].broken = true;
            Snd.gateBreak();
            G.shake = 10;
            burst(gd.cx, gd.cy, 22, '#ff5a3b', 200, 3.2, 0, true, 40);
          }
        }
      }
    }
  }

  // плавающие артефакты
  for(let i=G.floatingArtifacts.length-1; i>=0; i--){
    const a = G.floatingArtifacts[i];
    a.anim += dt;
    // авто-подбор через 2с и при близости к ядру (для бонусных)
    if(a.type === '_bonus'){
      if(a.anim > 1.2){ G.floatingArtifacts.splice(i,1); }
    }
  }

  // тревоги
  G.alarmT -= dt;
  const critical = G.coreHP < 45 || G.oxygen < 20;
  const breached = GATE_IDS.some(id=>G.gates[id].hp<=0);
  if((critical || breached) && G.alarmT <= 0){
    G.alarmT = 2.2;
    Snd.alarmBeep();
  }
  G.heartbeatT -= dt;
  if(G.heartbeatT <= 0 && (G.coreHP < 55 || G.oxygen < 30)){
    G.heartbeatT = G.coreHP < 25 ? 0.75 : 1.25;
    Snd.heartbeat();
  }

  if(G.coreHP <= 0){ G.coreHP = 0; finishGame(false); }
}

function updateEffects(dt){
  for(let i=0;i<particlePool.length;i++){
    const p = particlePool[i];
    if(!p.active) continue;
    p.life -= dt;
    if(p.life <= 0){ p.active = false; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += p.gravity*dt;
    p.vx *= Math.pow(p.drag, dt*60);
    p.vy *= Math.pow(p.drag, dt*60);
    p.rot += p.rotSpeed*dt;
  }
  for(let i=0;i<beamPool.length;i++){
    const b = beamPool[i];
    if(!b.active) continue;
    b.life -= dt;
    if(b.life <= 0) b.active = false;
  }
}

/* ============================================================
   РЕНДЕР МИРА
   ============================================================ */
function roomStatusColor(id){
  const G = game;
  if(!G) return '#39d4ff';
  if(id === 'core'){
    if(G.coreHP < 30) return '#ff3b3b';
    if(G.coreHP < 60) return '#ff9a3b';
    return '#39d4ff';
  }
  if(id === 'gen') return G.energy > 22 ? '#ffcf4a' : '#ff5a5a';
  if(id === 'oxy') return G.oxygen > 28 ? '#4affd0' : '#ff5a5a';
  if(id === 'arm') return '#ffa54a';
  if(id === 'lab') return '#a97bff';
  if(id === 'cargo') return '#ffb45a';
  if(id === 'work') return '#ffcf4a';
  if(id === 'med') return '#8dffb0';
  const g = G.gates[id];
  if(!g) return '#39d4ff';
  if(g.hp <= 0) return '#ff3b3b';
  if(g.hp < 35) return '#ff8a3b';
  return '#3bff9e';
}

function drawRoomStates(){
  const G = game;
  const pulse = 0.55 + 0.45*Math.sin(T*3.2);
  for(const id in ROOMS){
    const r = ROOMS[id];
    const col = roomStatusColor(id);
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.06*pulse;
    ctx.fillStyle = col;
    rr(ctx, r.x, r.y, r.w, r.h, 6); ctx.fill();
    ctx.globalAlpha = 0.55 + 0.25*pulse;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    rr(ctx, r.x, r.y, r.w, r.h, 6); ctx.stroke();
    ctx.restore();
  }

  if(G){
    const sec = SECTORS[G.sector];
    if(sec){
      ctx.save();
      ctx.strokeStyle = 'rgba(120,230,255,'+(0.45+0.25*Math.sin(T*4))+')';
      ctx.lineWidth = 2;
      ctx.setLineDash([8,6]);
      for(const rid of sec.rooms){
        const r = ROOMS[rid];
        rr(ctx, r.x-6, r.y-6, r.w+12, r.h+12, 10);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

function drawRoomLights(){
  // динамические огни от важных комнат
  const G = game;
  if(!G) return;
  const lights = [
    { room: ROOMS.gen, color: '#ffcf4a', intensity: G.energy/100 },
    { room: ROOMS.oxy, color: '#4affd0', intensity: G.oxygen/100 },
    { room: ROOMS.core, color: '#39d4ff', intensity: G.coreHP/100 }
  ];
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const l of lights){
    const cx = l.room.x + l.room.w/2;
    const cy = l.room.y + l.room.h/2;
    const r = Math.max(l.room.w, l.room.h) * 0.9;
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0, l.color + '55');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(T*2 + l.intensity);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
  }
  // предупреждающие огни у шлюзов
  for(const id of GATE_IDS){
    const g = G.gates[id];
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    if(g.hp <= 0){
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,60);
      grad.addColorStop(0, 'rgba(255,50,50,0.6)');
      grad.addColorStop(1, 'rgba(255,50,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,60,0,TAU); ctx.fill();
    } else if(g.hp < 40){
      const blink = Math.sin(T*8) * 0.5 + 0.5;
      ctx.globalAlpha = 0.3 + blink*0.4;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,45);
      grad.addColorStop(0, 'rgba(255,150,50,0.5)');
      grad.addColorStop(1, 'rgba(255,150,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,45,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}

function drawOperator(){
  // оператор в центре
  const G = game;
  if(!G) return;
  const pulse = 0.6 + 0.4*Math.sin(T*2.6);
  const hpRatio = G.coreHP/100;

  ctx.save();
  ctx.translate(CORE.x, CORE.y);

  // свечение ядра
  const grad = ctx.createRadialGradient(0,0,4,0,0,70);
  grad.addColorStop(0,'rgba(80,220,255,'+(0.35*pulse)+')');
  grad.addColorStop(1,'rgba(80,220,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0,0,70,0,TAU); ctx.fill();

  // внешние кольца
  ctx.strokeStyle = 'rgba(90,210,255,'+(0.5+0.3*pulse)+')';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,36,0,TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,210,255,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0,0,46, T*0.8, T*0.8 + Math.PI*1.3); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,28, -T*1.2, -T*1.2 + Math.PI*0.9); ctx.stroke();

  // тень под оператором
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 54, 14, 5, 0, 0, TAU); ctx.fill();

  // оператор (вид сверху, детализированный)
  // ноги
  ctx.fillStyle = '#1a2634';
  ctx.fillRect(-8, 36, 6, 12);
  ctx.fillRect(2, 36, 6, 12);
  // корпус
  ctx.fillStyle = '#2a3a4a';
  ctx.beginPath();
  ctx.moveTo(-11, 20);
  ctx.lineTo(11, 20);
  ctx.lineTo(13, 36);
  ctx.lineTo(-13, 36);
  ctx.closePath();
  ctx.fill();
  // жилет
  ctx.fillStyle = '#3b5068';
  ctx.fillRect(-9, 22, 18, 12);
  // плечи
  ctx.fillStyle = '#4a6b8a';
  ctx.beginPath(); ctx.arc(-11, 24, 4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 24, 4, 0, TAU); ctx.fill();
  // руки
  ctx.fillStyle = '#2a3a4a';
  ctx.fillRect(-14, 26, 4, 8);
  ctx.fillRect(10, 26, 4, 8);
  // кисти
  ctx.fillStyle = '#c8a888';
  ctx.beginPath(); ctx.arc(-12, 35, 2.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(12, 35, 2.5, 0, TAU); ctx.fill();
  // голова
  ctx.fillStyle = '#d4b090';
  ctx.beginPath(); ctx.arc(0, 14, 8, 0, TAU); ctx.fill();
  // шлем
  ctx.fillStyle = '#5ad1ff';
  ctx.beginPath(); ctx.arc(0, 12, 8, Math.PI, TAU); ctx.fill();
  // визор
  ctx.fillStyle = '#0a1420';
  ctx.beginPath(); ctx.arc(0, 14, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(90,225,255,0.9)';
  ctx.beginPath(); ctx.arc(0, 14, 3, 0, TAU); ctx.fill();

  // оружие в руках (текущее)
  const w = WEAPONS[G.weapon];
  ctx.save();
  ctx.translate(0, 30);
  ctx.rotate(Math.atan2(mouse.y - CORE.y, mouse.x - CORE.x));
  ctx.fillStyle = '#1a1a20';
  ctx.fillRect(0, -3, 22, 6);
  ctx.fillStyle = w.color;
  ctx.fillRect(20, -2, 6, 4);
  ctx.restore();

  // ядро сзади/вокруг оператора
  const coreCol = hpRatio > 0.6 ? '#39d4ff' : (hpRatio > 0.3 ? '#ffa53b' : '#ff3b3b');
  ctx.fillStyle = coreCol;
  ctx.beginPath(); ctx.arc(0, -20, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(-3, -23, 3.5, 0, TAU); ctx.fill();

  ctx.restore();
}

function drawTrapsAndTurrets(){
  const G = game;
  if(!G) return;

  for(const t of G.turrets){
    ctx.save();
    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(t.x+2, t.y+6, 11, 4, 0, 0, TAU); ctx.fill();
    // основа
    ctx.translate(t.x, t.y);
    ctx.fillStyle = '#1a2634';
    ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.fill();
    ctx.strokeStyle = '#5ad1ff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.stroke();
    // ствол
    ctx.rotate(t.angle);
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(4,-3,16,6);
    ctx.fillStyle = '#7fe9ff';
    ctx.fillRect(18,-2,4,4);
    // индикатор
    ctx.fillStyle = 'rgba(90,209,255,'+(0.6+0.4*Math.sin(T*6))+')';
    ctx.beginPath(); ctx.arc(0,0,3,0,TAU); ctx.fill();
    ctx.restore();
  }

  for(const l of G.lasers){
    const gd = GATE_DATA[l.gateId];
    const r = ROOMS[l.gateId];
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(T*6 + gd.cx);
    ctx.strokeStyle = '#ff4a9a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(r.x+8, gd.cy); ctx.lineTo(r.x+r.w-8, gd.cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gd.cx, r.y+8); ctx.lineTo(gd.cx, r.y+r.h-8);
    ctx.stroke();
    ctx.restore();
  }

  if(G.blocker){
    for(const id of GATE_IDS){
      const r = ROOMS[id];
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.10*Math.sin(T*4.5);
      ctx.fillStyle = '#5affd0';
      rr(ctx, r.x, r.y, r.w, r.h, 6); ctx.fill();
      ctx.restore();
    }
  }
}

function drawAllies(){
  const G = game;
  if(!G) return;
  for(const a of G.allies){
    const def = ALLIES_DEF.find(d=>d.id===a.id);
    if(!def) continue;
    const isHover = dist(mouse.x, mouse.y, a.x, a.y) < 22;
    const pulse = 0.5 + 0.5*Math.sin(T*3 + a.x*0.01);

    // свечение
    const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, isHover?40:28);
    grad.addColorStop(0, a.color + (isHover?'88':'44'));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(a.x, a.y, isHover?40:28, 0, TAU); ctx.fill();

    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(a.x, a.y+9, 11, 4, 0, 0, TAU); ctx.fill();

    // персонаж
    ctx.save();
    ctx.translate(a.x, a.y);
    // ноги
    ctx.fillStyle = '#1a2634';
    ctx.fillRect(-6, 4, 5, 8);
    ctx.fillRect(1, 4, 5, 8);
    // корпус
    ctx.fillStyle = a.id === 'engineer' ? '#5a4520' : (a.id==='scientist'?'#2a4a5a':'#2a5a3a');
    ctx.beginPath();
    ctx.moveTo(-8, -6); ctx.lineTo(8, -6); ctx.lineTo(9, 4); ctx.lineTo(-9, 4);
    ctx.closePath(); ctx.fill();
    // деталь
    ctx.fillStyle = a.color;
    ctx.fillRect(-7, -4, 14, 3);
    // голова
    ctx.fillStyle = '#d4b090';
    ctx.beginPath(); ctx.arc(0, -10, 6, 0, TAU); ctx.fill();
    // цветной маркер
    ctx.fillStyle = a.color;
    ctx.beginPath(); ctx.arc(0, -10, 3, 0, TAU); ctx.fill();
    ctx.restore();

    // метка "!"
    if(!a.met){
      ctx.save();
      ctx.fillStyle = 'rgba(255,220,80,'+(0.6+0.4*pulse)+')';
      ctx.font = 'bold 16px "Courier New",monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', a.x, a.y - 26 + Math.sin(T*4)*3);
      ctx.restore();
    }
    // подпись
    ctx.fillStyle = 'rgba(200,230,255,0.75)';
    ctx.font = '9px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.fillText(a.name.split(' ')[0], a.x, a.y + 26);
  }
}

function drawFloatingArtifacts(){
  const G = game;
  if(!G) return;
  for(const a of G.floatingArtifacts){
    const def = ARTIFACT_TYPES[a.type];
    if(!def) continue;
    const yOff = Math.sin(a.anim*3)*4;
    const x = a.x, y = a.y + yOff;

    // свечение
    const grad = ctx.createRadialGradient(x, y, 0, x, y, 20);
    grad.addColorStop(0, def.color + '88');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.fill();

    // гексагон
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a.anim*0.8);
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const ang = i/6*TAU;
      const px = Math.cos(ang)*9, py = Math.sin(ang)*9;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = def.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
    // буква
    ctx.fillStyle = '#0a1420';
    ctx.font = 'bold 11px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.glyph, x, y+1);
  }
  // бонусные тексты
  for(const a of G.floatingArtifacts){
    if(a.type === '_bonus' && a.text){
      const alpha = 1 - a.anim/1.2;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#8dffb0';
      ctx.font = 'bold 12px "Courier New",monospace';
      ctx.textAlign = 'center';
      ctx.fillText(a.text, CORE.x, CORE.y - 100 - a.anim*30);
      ctx.restore();
    }
  }
}

function drawEnemy(e){
  const flash = e.flash > 0;
  const alpha = e.cloaked ? 0.15 : 1;
  const s = e.size;

  // тень
  if(!e.cloaked){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + s*0.85, s*0.9, s*0.35, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // свечение
  if(!e.cloaked && e.type !== 'stealth'){
    const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, s*2.4);
    grad.addColorStop(0, e.color + '55');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(e.x, e.y, s*2.4, 0, TAU); ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(e.x, e.y);

  if(e.type === 'parasite'){
    ctx.rotate(e.angle);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.moveTo(s, 0); ctx.lineTo(-s*0.75, s*0.7);
    ctx.lineTo(-s*0.35, 0); ctx.lineTo(-s*0.75, -s*0.7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = flash ? '#ffffff' : '#2a5a2a';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // ножки
    ctx.strokeStyle = flash ? '#ffffff' : e.color;
    ctx.lineWidth = 1.4;
    const w = Math.sin(e.anim*14)*3;
    ctx.beginPath();
    ctx.moveTo(-s*0.2, s*0.5); ctx.lineTo(-s*0.9, s*0.95+w);
    ctx.moveTo(-s*0.2,-s*0.5); ctx.lineTo(-s*0.9,-s*0.95-w);
    ctx.stroke();
    // глаза
    ctx.fillStyle = '#0a1a0a';
    ctx.beginPath(); ctx.arc(s*0.5, s*0.2, s*0.15, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.5, -s*0.2, s*0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#3bff9e';
    ctx.beginPath(); ctx.arc(s*0.55, s*0.2, s*0.08, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.55, -s*0.2, s*0.08, 0, TAU); ctx.fill();
  }
  else if(e.type === 'drone'){
    ctx.rotate(e.anim*0.9);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = i/6*TAU;
      const px = Math.cos(a)*s, py = Math.sin(a)*s;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1808'; ctx.lineWidth = 1.6;
    ctx.stroke();
    // винты
    ctx.strokeStyle = flash ? '#ffffff' : '#2a1c0c';
    ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      const a = i/3*TAU + e.anim*2;
      const px = Math.cos(a)*s*0.5, py = Math.sin(a)*s*0.5;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px + Math.cos(a+0.3)*4, py + Math.sin(a+0.3)*4);
      ctx.stroke();
    }
    // глаз
    ctx.fillStyle = '#2a1c0c';
    ctx.beginPath(); ctx.arc(0,0,s*0.28,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff5a5a';
    ctx.beginPath(); ctx.arc(0,0,s*0.15,0,TAU); ctx.fill();
  }
  else if(e.type === 'stealth'){
    ctx.rotate(e.anim*1.6);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.moveTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.lineTo(0,-s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = flash ? '#ffffff' : 'rgba(200,160,255,0.8)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // контур
    ctx.beginPath(); ctx.arc(0,0,s*1.5,e.anim*3, e.anim*3+2.1); ctx.stroke();
    // глаз
    ctx.fillStyle = flash ? '#ffffff' : '#5a2a8a';
    ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff8ad8';
    ctx.beginPath(); ctx.arc(0,0,s*0.1,0,TAU); ctx.fill();
  }
  else if(e.type === 'brute'){
    ctx.rotate(e.anim*0.5);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath(); ctx.arc(0,0,s,0,TAU); ctx.fill();
    // шипы
    ctx.fillStyle = 'rgba(20,8,8,0.7)';
    for(let i=0;i<6;i++){
      const a = i/6*TAU;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(-4,-s-2); ctx.lineTo(4,-s-2); ctx.lineTo(0,-s-9);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // глаз
    ctx.fillStyle = '#2a0c0c';
    ctx.beginPath(); ctx.arc(0,0,s*0.4,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff3b3b';
    ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
  }
  else if(e.type === 'crawler'){
    ctx.rotate(e.angle);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    // тело
    ctx.beginPath();
    ctx.ellipse(0, 0, s*1.1, s*0.65, 0, 0, TAU);
    ctx.fill();
    // лапки
    ctx.strokeStyle = flash ? '#ffffff' : e.color;
    ctx.lineWidth = 1.3;
    for(let i=-1;i<=1;i++){
      const ph = Math.sin(e.anim*18 + i*1.2)*3;
      ctx.beginPath();
      ctx.moveTo(-s*0.3, i*s*0.4);
      ctx.lineTo(-s*0.8, i*s*0.5 + ph);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.3, i*s*0.4);
      ctx.lineTo(s*0.8, i*s*0.5 + ph);
      ctx.stroke();
    }
    // голова
    ctx.fillStyle = '#7a3010';
    ctx.beginPath(); ctx.arc(s*0.9, 0, s*0.35, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath(); ctx.arc(s*0.9, 0, s*0.15, 0, TAU); ctx.fill();
  }
  else if(e.type === 'shooter'){
    ctx.rotate(e.anim*0.7);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a = i/8*TAU;
      const r = i%2 === 0 ? s : s*0.6;
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a1a3a';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // центр
    ctx.fillStyle = '#3a0a2a';
    ctx.beginPath(); ctx.arc(0,0,s*0.4,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff8aff';
    ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
    // "пушки"
    ctx.fillStyle = '#3a1a3a';
    ctx.fillRect(s*0.8, -2, 6, 4);
    ctx.fillRect(-s*0.8-6, -2, 6, 4);
  }

  ctx.restore();

  // хп-бар
  if(!e.cloaked && (e.hp < e.maxHp || (game && game.upgrades.scanner))){
    const w = Math.max(16, e.size*2.6);
    const x = e.x - w/2, y = e.y - e.size - 12;
    const p = clamp(e.hp/e.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x-1, y-1, w+2, 5);
    ctx.fillStyle = p > 0.6 ? '#3bff9e' : (p > 0.3 ? '#ffcf4a' : '#ff3b3b');
    ctx.fillRect(x, y, w*p, 3);
  }
}

function drawEnemies(){
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active) continue;
    drawEnemy(e);
  }
}

function drawProjectiles(){
  for(let i=0;i<projPool.length;i++){
    const p = projPool[i];
    if(!p.active) continue;
    // свечение
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*4);
    grad.addColorStop(0, p.color + '88');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*4, 0, TAU); ctx.fill();
    // снаряд
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*0.5, 0, TAU); ctx.fill();
  }
}

function drawBeams(){
  ctx.save();
  ctx.lineCap = 'round';
  for(let i=0;i<beamPool.length;i++){
    const b = beamPool[i];
    if(!b.active) continue;
    const a = clamp(b.life/b.maxLife, 0, 1);
    ctx.globalAlpha = a*0.95;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.width*a + 0.6;
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2);
    ctx.stroke();
    ctx.globalAlpha = a*0.5;
    ctx.lineWidth = b.width*a*2.4 + 1;
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(){
  ctx.save();
  for(let i=0;i<particlePool.length;i++){
    const p = particlePool[i];
    if(!p.active) continue;
    const a = clamp(p.life/p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if(p.glow){
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*2);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*2, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = p.color;
    const s = p.size*a;
    if(p.shape === 0){
      ctx.fillRect(p.x - s*0.5, p.y - s*0.5, s, s);
    } else if(p.shape === 1){
      ctx.beginPath(); ctx.arc(p.x, p.y, s*0.6, 0, TAU); ctx.fill();
    } else if(p.shape === 2){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-s, -s*0.2, s*2, s*0.4);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawPanel(x,y,w,h,title){
  ctx.fillStyle = 'rgba(6,12,20,0.90)';
  rr(ctx,x,y,w,h,5); ctx.fill();
  ctx.strokeStyle = 'rgba(58,130,175,0.55)';
  ctx.lineWidth = 1;
  rr(ctx,x,y,w,h,5); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,200,255,0.75)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+4, y+14); ctx.lineTo(x+4, y+4); ctx.lineTo(x+18, y+4);
  ctx.moveTo(x+w-18, y+h-4); ctx.lineTo(x+w-4, y+h-4); ctx.lineTo(x+w-4, y+h-14);
  ctx.stroke();
  if(title) txt(title, x+12, y+16, 11, 'rgba(120,205,240,0.95)', 'left', 'bold');
}

function drawBar(x,y,w,h,val,max,color,label,showVal){
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(x,y,w,h);
  const p = clamp(val/max, 0, 1);
  const grad = ctx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = color;
  ctx.fillRect(x,y,w*p,h);
  // блик
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x,y,w*p,h*0.3);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);

function drawHUD(){
  const G = game;
  if(!G) return;

  // верхняя панель
  ctx.fillStyle = 'rgba(5,10,16,0.92)';
  ctx.fillRect(0,0,VW,46);
  ctx.strokeStyle = 'rgba(50,120,165,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,46.5); ctx.lineTo(VW,46.5); ctx.stroke();

  txt('СМЕНА ' + G.clock, 18, 23, 17, '#7fe9ff', 'left', 'bold');
  const modeName = G.mode==='survival' ? 'ВЫЖИВАНИЕ'
                 : G.mode==='hardcore' ? 'ХАРДКОР / БЛЭКАУТ'
                 : 'БЕСКОНЕЧНЫЙ';
  txt(modeName, 190, 23, 12, 'rgba(130,190,225,0.9)');
  txt('ВОЛНА ' + G.wave, 350, 23, 12, 'rgba(255,180,90,0.9)', 'left', 'bold');

  // индикатор опасности
  const dx = 470;
  txt('УРОВЕНЬ ОПАСНОСТИ', dx, 15, 9, 'rgba(150,190,215,0.8)');
  for(let i=0;i<10;i++){
    const on = i < G.danger;
    ctx.fillStyle = on ? (G.danger>7?'#ff3b3b':(G.danger>4?'#ffb03b':'#3bff9e')) : 'rgba(255,255,255,0.10)';
    ctx.fillRect(dx + i*17, 25, 13, 9);
  }

  const btn = (x,y,w,h,label,fn,col) => {
    const hv = inRect(mouse.x,mouse.y,x,y,w,h);
    ctx.fillStyle = hv ? 'rgba(30,70,100,0.95)' : 'rgba(14,26,38,0.95)';
    rr(ctx,x,y,w,h,4); ctx.fill();
    ctx.strokeStyle = hv ? 'rgba(120,220,255,0.95)' : (col||'rgba(70,130,170,0.7)');
    ctx.lineWidth = 1.4;
    rr(ctx,x,y,w,h,4); ctx.stroke();
    txt(label, x+w/2, y+h/2+1, 12, hv?'#d8f4ff':'#9fd0e8', 'center', 'bold');
    addZone(x,y,w,h,fn);
  };

  btn(1020, 8, 118, 30, 'МАГАЗИН [B]', ()=>{ screen='shop'; Snd.click(); });
  btn(1148, 8, 116, 30, 'ПАУЗА [ESC]', ()=>{ screen='pause'; Snd.click(); });

  // правая панель ресурсов
  const px = 962, py = 54, pw = 308, ph = 300;
  drawPanel(px, py, pw, ph, 'СИСТЕМЫ ЖИЗНЕОБЕСПЕЧЕНИЯ');

  drawBar(px+14, py+48, pw-28, 13, G.energy, G.energyMax, '#ffcf4a', 'ЭНЕРГИЯ (кВт)', true);
  drawBar(px+14, py+90, pw-28, 13, G.oxygen, 100, G.oxygen>30?'#4affd0':'#ff5a5a', 'КИСЛОРОД (%)', true);
  drawBar(px+14, py+132, pw-28, 13, G.coreHP, 100, G.coreHP>60?'#39d4ff':(G.coreHP>30?'#ffa53b':'#ff3b3b'), 'ПРОЧНОСТЬ ЯДРА (%)', true);

  txt('КРЕДИТЫ', px+14, py+180, 10, 'rgba(150,190,215,0.9)');
  txt('$ ' + Math.floor(G.credits), px+14, py+200, 19, '#8dffb0', 'left', 'bold');

  let bx = px+150;
  for(const id of GATE_IDS){
    const g = G.gates[id];
    const col = g.hp<=0?'#ff3b3b':(g.hp<35?'#ff8a3b':'#3bff9e');
    ctx.fillStyle = col;
    ctx.fillRect(bx, py+180, 30, 8);
    txt(GATE_DATA[id].label, bx+15, py+200, 10, col, 'center', 'bold');
    bx += 38;
  }

  // артефакты
  txt('АРТЕФАКТЫ ' + G.artifacts.length + '/' + G.maxArtifacts, px+14, py+236, 10, 'rgba(150,190,215,0.9)');
  for(let i=0;i<G.maxArtifacts;i++){
    const ax = px+14 + i*34, ay = py+248;
    if(i < G.artifacts.length){
      const def = ARTIFACT_TYPES[G.artifacts[i]];
      ctx.save();
      ctx.translate(ax+12, ay+12);
      ctx.beginPath();
      for(let k=0;k<6;k++){
        const ang = k/6*TAU - Math.PI/2;
        const px2 = Math.cos(ang)*11, py2 = Math.sin(ang)*11;
        if(k===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);
      }
      ctx.closePath();
      ctx.fillStyle = def.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#0a1420';
      ctx.font = 'bold 10px "Courier New",monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.glyph, 0, 1);
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(60,70,80,0.6)';
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(ax+12, ay+12, 10, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // левая панель — сектор
  const lx = 10, ly = 54, lw = 220, lh = 300;
  drawPanel(lx, ly, lw, lh, 'КАМЕРА ' + (G.sector+1));
  const sec = SECTORS[G.sector];
  txt(sec.name, lx+12, ly+40, 11, '#bde8ff', 'left', 'bold');

  let threatCount = 0, inSector = 0;
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active) continue;
    threatCount++;
    if(sec.id==='gates'){ if(e.gateId!=='vent') inSector++; }
    else if(sec.id==='vent'){ if(e.gateId==='vent') inSector++; }
  }
  txt('УГРОЗ В СЕКТОРЕ: ' + inSector, lx+12, ly+62, 11, inSector>0?'#ff8a8a':'#7fbfa0');
  txt('ВСЕГО УГРОЗ: ' + threatCount, lx+12, ly+80, 11, 'rgba(160,200,225,0.9)');

  // союзники
  txt('СОЮЗНИКИ', lx+12, ly+104, 10, 'rgba(150,190,215,0.9)', 'left', 'bold');
  for(let i=0;i<G.allies.length;i++){
    const a = G.allies[i];
    const ay = ly+118 + i*22;
    ctx.fillStyle = a.met ? a.color : 'rgba(80,80,90,0.6)';
    ctx.fillRect(lx+12, ay+2, 4, 14);
    txt(a.name.split(' ')[0], lx+22, ay+9, 10, a.met?a.color:'rgba(120,140,160,0.6)');
  }

  const abtn = (x,y,w,h,label,fn,ready) => {
    const hv = inRect(mouse.x,mouse.y,x,y,w,h);
    ctx.fillStyle = ready ? (hv?'rgba(30,80,60,0.95)':'rgba(16,38,30,0.95)') : 'rgba(24,24,28,0.9)';
    rr(ctx,x,y,w,h,4); ctx.fill();
    ctx.strokeStyle = ready ? (hv?'rgba(110,255,180,0.95)':'rgba(60,160,110,0.7)') : 'rgba(70,70,80,0.6)';
    ctx.lineWidth = 1.3;
    rr(ctx,x,y,w,h,4); ctx.stroke();
    txt(label, x+w/2, y+h/2+1, 10, ready?(hv?'#d8ffe8':'#8ee0b0'):'#5a6068', 'center', 'bold');
    addZone(x,y,w,h,fn);
  };

  abtn(lx+12, ly+186, lw-24, 28, 'РЕМОНТ ШЛЮЗОВ [R]  -30Э', repairGates, G.energy>=30 && G.repairCd<=0);
  abtn(lx+12, ly+220, lw-24, 28, 'ПОДАЧА КИСЛОРОДА [F]  -16Э', boostOxygen, G.energy>=16 && G.oxygenCd<=0);
  abtn(lx+12, ly+254, lw-24, 28, 'ПЕРЕЗАГРУЗКА [ПРОБЕЛ]', rebootEnergy, G.rebootCd<=0);
  if(G.rebootCd > 0){
    txt('ПЕРЕЗАРЯДКА ' + G.rebootCd.toFixed(1) + 'с', lx+12, ly+288, 10, 'rgba(255,180,90,0.9)');
  } else {
    txt('ГОТОВО', lx+12, ly+288, 10, 'rgba(120,220,255,0.8)');
  }

  // нижняя панель оружия
  ctx.fillStyle = 'rgba(5,10,16,0.92)';
  ctx.fillRect(0, 664, VW, 56);
  ctx.strokeStyle = 'rgba(50,120,165,0.6)';
  ctx.beginPath(); ctx.moveTo(0,663.5); ctx.lineTo(VW,663.5); ctx.stroke();

  for(let i=0;i<WEAPONS.length;i++){
    const w = WEAPONS[i];
    const x = 20 + i*188, y = 670, ww = 178, hh = 44;
    const unlocked = G.unlocked[i];
    const active = G.weapon === i;
    const hv = inRect(mouse.x,mouse.y,x,y,ww,hh);

    ctx.fillStyle = active ? 'rgba(25,60,85,0.98)' : (unlocked ? (hv?'rgba(18,36,52,0.98)':'rgba(10,20,30,0.95)') : 'rgba(14,14,18,0.9)');
    rr(ctx,x,y,ww,hh,4); ctx.fill();
    ctx.strokeStyle = active ? 'rgba(120,225,255,1)' : (unlocked?'rgba(60,120,160,0.7)':'rgba(60,60,70,0.5)');
    ctx.lineWidth = active ? 2 : 1.2;
    rr(ctx,x,y,ww,hh,4); ctx.stroke();

    ctx.fillStyle = unlocked ? w.color : '#404450';
    ctx.fillRect(x+8, y+9, 4, 26);

    txt(w.name, x+20, y+16, 11, unlocked?(active?'#d8f4ff':'#a8cfe6'):'#50555f', 'left', 'bold');
    txt(unlocked ? ('УРОН ' + w.dmg + '  ЗАРЯД ' + w.cost) : 'НЕ КУПЛЕНО', x+20, y+32, 9,
        unlocked?'rgba(140,180,205,0.9)':'#4a4f58');

    if(active && G.fireCd > 0){
      const p = clamp(1 - G.fireCd/w.cd, 0, 1);
      ctx.fillStyle = 'rgba(120,225,255,0.55)';
      ctx.fillRect(x+2, y+hh-4, (ww-4)*p, 2);
    }
    addZone(x,y,ww,hh,()=>{
      if(unlocked){ G.weapon = i; Snd.click(); }
      else { Snd.err(); screen='shop'; }
    });
  }

  txt('ЛКМ — огонь   Q/E — оружие   1-8 — камеры   B — магазин   ESC — пауза',
      VW-20, 690, 10, 'rgba(130,170,195,0.75)', 'right');

  if(G.flashRed > 0){
    ctx.save();
    ctx.globalAlpha = G.flashRed*0.35;
    ctx.fillStyle = '#ff1a1a';
    ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }
}

function drawMenuBackground(){
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0,0,VW,VH);

  // мерцающие лампы
  ctx.save();
  for(let i=0;i<6;i++){
    const x = 130 + i*190;
    const y = 150 + (i%3)*180;
    let flick = 0.55 + 0.35*Math.sin(menuT*2.3 + i*2.1);
    if(Math.random() < 0.012) flick *= 0.15;
    ctx.globalAlpha = flick;
    ctx.drawImage(lightCanvas, x-160, y-160, 320, 320);
  }
  ctx.restore();

  // линии перспективы
  ctx.save();
  ctx.strokeStyle = 'rgba(40,110,150,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0;i<26;i++){
    const x = i*(VW/25);
    ctx.moveTo(x, VH);
    ctx.lineTo(VW/2 + (x-VW/2)*0.15, 320);
  }
  ctx.stroke();
  ctx.restore();

  // сетка
  ctx.save();
  ctx.strokeStyle = 'rgba(35,80,110,0.14)';
  ctx.beginPath();
  for(let x=0;x<=VW;x+=48){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,VH); }
  for(let y=0;y<=VH;y+=48){ ctx.moveTo(0,y+0.5); ctx.lineTo(VW,y+0.5); }
  ctx.stroke();
  ctx.restore();

  // декоративные трубы внизу
  ctx.save();
  ctx.fillStyle = 'rgba(60,80,100,0.25)';
  ctx.fillRect(0, VH-40, VW, 8);
  ctx.fillStyle = 'rgba(40,60,80,0.3)';
  for(let x=20;x<VW;x+=80){
    ctx.beginPath(); ctx.arc(x, VH-36, 4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function renderShop(){
  const G = game;
  ctx.fillStyle = 'rgba(3,7,12,0.94)';
  ctx.fillRect(0,0,VW,VH);

  txt('АРСЕНАЛ И МАГАЗИН', 60, 46, 24, '#bdeaff', 'left', 'bold');
  txt('КРЕДИТЫ: $ ' + Math.floor(G.credits), 60, 78, 15, '#8dffb0', 'left', 'bold');
  txt('СМЕНА ' + G.clock + '  •  ВРЕМЯ: ' + formatTime(G.time), 400, 78, 12,
      'rgba(150,190,215,0.85)');

  const cw = 190, ch = 38, cx = VW-60-cw, cy = 32;
  const chv = inRect(mouse.x,mouse.y,cx,cy,cw,ch);
  ctx.fillStyle = chv?'rgba(30,60,85,0.98)':'rgba(14,26,38,0.95)';
  rr(ctx,cx,cy,cw,ch,4); ctx.fill();
  ctx.strokeStyle = chv?'rgba(120,225,255,0.95)':'rgba(70,130,170,0.7)';
  ctx.lineWidth = 1.4; rr(ctx,cx,cy,cw,ch,4); ctx.stroke();
  txt('ЗАКРЫТЬ [ESC]', cx+cw/2, cy+ch/2+1, 12, chv?'#dcf6ff':'#9fd0e8', 'center', 'bold');
  addZone(cx,cy,cw,ch,()=>{ Snd.click(); screen='game'; });

  const items = getShopItems();
  const cols = 4, cardW = 275, cardH = 120, gapX = 20, gapY = 15;
  const startX = 60, startY = 110;

  for(let i=0;i<items.length;i++){
    const it = items[i];
    const col = i % cols, row = Math.floor(i/cols);
    const x = startX + col*(cardW+gapX);
    const y = startY + row*(cardH+gapY);

    const canBuy = !it.owned && G.credits >= it.price;
    const hv = inRect(mouse.x,mouse.y,x,y,cardW,cardH);

    ctx.fillStyle = it.owned ? 'rgba(16,38,28,0.92)'
                  : (canBuy ? (hv?'rgba(22,52,76,0.96)':'rgba(12,24,36,0.94)')
                            : 'rgba(14,16,20,0.92)');
    rr(ctx,x,y,cardW,cardH,5); ctx.fill();
    ctx.strokeStyle = it.owned ? 'rgba(80,220,140,0.65)'
                    : (canBuy ? (hv?'rgba(120,225,255,0.95)':'rgba(60,130,175,0.7)')
                              : 'rgba(60,62,70,0.6)');
    ctx.lineWidth = hv && canBuy ? 1.8 : 1.2;
    rr(ctx,x,y,cardW,cardH,5); ctx.stroke();

    txt(it.cat, x+14, y+18, 9, 'rgba(110,170,205,0.8)', 'left', 'bold');
    txt(it.name, x+14, y+42, 13, it.owned?'#8dffb0':(canBuy?'#dcf6ff':'#6a7078'), 'left', 'bold');
    txt(it.sub, x+14, y+62, 10, 'rgba(140,180,205,0.8)');

    const bw = cardW-28, bh = 30, bx = x+14, by = y+cardH-42;
    if(it.owned){
      ctx.fillStyle = 'rgba(30,70,50,0.9)';
      rr(ctx,bx,by,bw,bh,4); ctx.fill();
      ctx.strokeStyle = 'rgba(80,220,140,0.6)';
      ctx.lineWidth = 1.2; rr(ctx,bx,by,bw,bh,4); ctx.stroke();
      txt('УСТАНОВЛЕНО', bx+bw/2, by+bh/2+1, 11, '#8dffb0', 'center', 'bold');
    } else {
      const affordable = G.credits >= it.price;
      ctx.fillStyle = affordable ? (hv?'rgba(40,110,70,0.98)':'rgba(20,56,38,0.95)') : 'rgba(26,26,30,0.9)';
      rr(ctx,bx,by,bw,bh,4); ctx.fill();
      ctx.strokeStyle = affordable ? (hv?'rgba(110,255,180,0.95)':'rgba(60,160,110,0.7)') : 'rgba(70,70,78,0.6)';
      ctx.lineWidth = 1.3; rr(ctx,bx,by,bw,bh,4); ctx.stroke();
      txt('$ ' + it.price, bx+bw/2, by+bh/2+1, 13, affordable?'#8dffb0':'#5a6068', 'center', 'bold');
      if(affordable) addZone(bx,by,bw,bh,()=>{ it.buy(); });
    }
  }

  if(settings.crt) drawCRTOverlay(0.3);
}

function renderDialog(){
  const G = game;
  if(!G || !G.dialog) return;
  renderGame();

  ctx.fillStyle = 'rgba(3,7,12,0.75)';
  ctx.fillRect(0,0,VW,VH);

  const d = G.dialog;
  const px = VW/2 - 440, py = VH/2 - 180, pw = 880, ph = 360;
  drawPanel(px, py, pw, ph, 'РАЗГОВОР • ' + d.def.name);

  // портрет
  const allyX = px+90, allyY = py+ph/2;
  // фон портрета
  ctx.fillStyle = 'rgba(10,20,30,0.95)';
  rr(ctx, px+30, py+40, 120, 240, 6); ctx.fill();
  ctx.strokeStyle = d.def.color + '80';
  ctx.lineWidth = 2;
  rr(ctx, px+30, py+40, 120, 240, 6); ctx.stroke();

  // сам союзник в портрете
  ctx.save();
  ctx.translate(allyX, allyY);
  ctx.scale(3, 3);
  ctx.fillStyle = d.def.id === 'engineer' ? '#5a4520' : (d.def.id==='scientist'?'#2a4a5a':'#2a5a3a');
  ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(8,-6); ctx.lineTo(9,4); ctx.lineTo(-9,4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = d.def.color; ctx.fillRect(-7, -4, 14, 3);
  ctx.fillStyle = '#d4b090';
  ctx.beginPath(); ctx.arc(0,-10,6,0,TAU); ctx.fill();
  ctx.fillStyle = d.def.color;
  ctx.beginPath(); ctx.arc(0,-10,3,0,TAU); ctx.fill();
  ctx.restore();

  // имя под портретом
  txt(d.def.name.split(' ').slice(0,2).join(' '), allyX, py+ph-20, 11, d.def.color, 'center', 'bold');

  // текст
  const textX = px+180, textY = py+80;
  const line = d.def.dialogs[d.page];
  // обёртка текста
  const words = line.split(' ');
  let lineY = textY;
  let curLine = '';
  const maxW = pw-230;
  ctx.font = '14px "Courier New",monospace';
  for(const w of words){
    const test = curLine ? curLine+' '+w : w;
    if(ctx.measureText(test).width > maxW){
      txt(curLine, textX, lineY, 14, '#d8f4ff');
      lineY += 26;
      curLine = w;
    } else { curLine = test; }
  }
  if(curLine) txt(curLine, textX, lineY, 14, '#d8f4ff');

  // индикатор страниц
  txt((d.page+1) + ' / ' + d.def.dialogs.length, textX, py+ph-56, 11, 'rgba(130,180,210,0.7)');

  // кнопка "далее"
  const bw = 200, bh = 40, bx = px+pw-bw-30, by = py+ph-bh-24;
  const hv = inRect(mouse.x,mouse.y,bx,by,bw,bh);
  ctx.fillStyle = hv?'rgba(30,90,60,0.98)':'rgba(14,36,26,0.95)';
  rr(ctx,bx,by,bw,bh,4); ctx.fill();
  ctx.strokeStyle = hv?'rgba(110,255,180,0.95)':'rgba(60,160,110,0.7)';
  ctx.lineWidth = 1.4; rr(ctx,bx,by,bw,bh,4); ctx.stroke();
  const isLast = d.page >= d.def.dialogs.length-1;
  txt(isLast?'ЗАКОНЧИТЬ':'ДАЛЕЕ', bx+bw/2, by+bh/2+1, 13, hv?'#d8ffe8':'#8ee0b0', 'center', 'bold');
  addZone(bx,by,bw,bh,()=>{ advanceDialog(); });

  if(settings.crt) drawCRTOverlay(0.3);
}

/* ============================================================
   ГЛАВНЫЙ РЕНДЕР
   ============================================================ */
function render(){
  zones.length = 0;
  ctx.imageSmoothingEnabled = true;

  if(screen === 'game'){ renderGame(); }
  else if(screen === 'menu'){ renderMenu(); }
  else if(screen === 'modes'){ renderModes(); }
  else if(screen === 'settings'){ renderSettings(); }
  else if(screen === 'help'){ renderHelp(); }
  else if(screen === 'pause'){ renderGame(); renderPauseOverlay(); }
  else if(screen === 'shop'){ renderGame(); renderShop(); }
  else if(screen === 'dialog'){ renderDialog(); }
  else if(screen === 'over' || screen === 'victory'){ renderEndScreen(screen === 'victory'); }
}

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
function update(dt){
  menuT += dt;
  noiseTick++;
  if(noiseTick % 3 === 0) updateNoise();

  if(screen === 'game'){
    updateGame(dt);
    updateEffects(dt);
  } else if(screen === 'dialog'){
    updateEffects(dt);
  }
}

/* ============================================================
   ВВОД
   ============================================================ */
function updateMouse(e){
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (VW / r.width);
  mouse.y = (e.clientY - r.top) * (VH / r.height);
}

canvas.addEventListener('mousemove', updateMouse);

canvas.addEventListener('mousedown', function(e){
  if(e.button !== 0) return;
  Snd.init();
  updateMouse(e);
  mouseDown = true;
  mouseDownStart = performance.now();
  const z = hitTest(mouse.x, mouse.y);
  if(z){ z.fn(); return; }
  if(screen === 'game'){
    // проверка клика по союзникам
    if(game){
      let clickedAlly = null;
      for(const a of game.allies){
        if(dist(mouse.x, mouse.y, a.x, a.y) < 22){ clickedAlly = a; break; }
      }
      if(clickedAlly){
        openDialog(clickedAlly.id);
        return;
      }
      // клик по артефактам
      for(let i=game.floatingArtifacts.length-1; i>=0; i--){
        const a = game.floatingArtifacts[i];
        if(a.type === '_bonus') continue;
        if(dist(mouse.x, mouse.y, a.x, a.y) < 20){
          if(addArtifact(game, a.type)){
            game.stats.artifactsCollected++;
            Snd.artifact();
            burst(a.x, a.y, 20, ARTIFACT_TYPES[a.type].color, 160, 3, 1, true, 20);
            ringBurst(a.x, a.y, 16, ARTIFACT_TYPES[a.type].color, 50, 100, 2.5, true);
            game.floatingArtifacts.splice(i,1);
          } else {
            Snd.err();
          }
          return;
        }
      }
    }
    fireAt(mouse.x, mouse.y);
  }
});

window.addEventListener('mouseup', function(){ mouseDown = false; });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  if(e.touches.length === 0) return;
  Snd.init();
  const t = e.touches[0];
  updateMouse(t);
  const z = hitTest(mouse.x, mouse.y);
  if(z){ z.fn(); return; }
  if(screen === 'game'){
    if(game){
      for(const a of game.allies){
        if(dist(mouse.x, mouse.y, a.x, a.y) < 30){ openDialog(a.id); return; }
      }
      for(let i=game.floatingArtifacts.length-1; i>=0; i--){
        const a = game.floatingArtifacts[i];
        if(a.type === '_bonus') continue;
        if(dist(mouse.x, mouse.y, a.x, a.y) < 26){
          if(addArtifact(game, a.type)){
            game.stats.artifactsCollected++;
            Snd.artifact();
            game.floatingArtifacts.splice(i,1);
          }
          return;
        }
      }
    }
    fireAt(mouse.x, mouse.y);
  }
}, {passive:false});

canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  if(e.touches.length === 0) return;
  updateMouse(e.touches[0]);
}, {passive:false});

window.addEventListener('keydown', function(e){
  Snd.init();

  if(screen === 'game'){
    if(e.key >= '1' && e.key <= '8'){
      game.sector = parseInt(e.key,10) - 1;
      Snd.click();
      return;
    }
    if(e.code === 'Space'){ e.preventDefault(); rebootEnergy(); return; }
    if(e.key === 'q' || e.key === 'Q'){ cycleWeapon(-1); return; }
    if(e.key === 'e' || e.key === 'E'){ cycleWeapon(1); return; }
    if(e.key === 'r' || e.key === 'R'){ repairGates(); return; }
    if(e.key === 'f' || e.key === 'F'){ boostOxygen(); return; }
    if(e.key === 'b' || e.key === 'B'){ screen = 'shop'; Snd.click(); return; }
    if(e.key === 'Escape'){ screen = 'pause'; Snd.click(); return; }
  }
  else if(screen === 'pause' || screen === 'shop'){
    if(e.key === 'Escape'){ screen = 'game'; Snd.click(); }
  }
  else if(screen === 'dialog'){
    if(e.key === 'Escape' || e.key === ' '){ e.preventDefault(); advanceDialog(); }
  }
  else if(screen === 'modes' || screen === 'settings' || screen === 'help'){
    if(e.key === 'Escape'){ screen = 'menu'; Snd.click(); }
  }
});

/* ============================================================
   МАСШТАБИРОВАНИЕ И ЦИКЛ
   ============================================================ */
function resize(){
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  const w = Math.floor(VW * s), h = Math.floor(VH * s);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.left = Math.floor((window.innerWidth - w)/2) + 'px';
  canvas.style.top = Math.floor((window.innerHeight - h)/2) + 'px';
}
window.addEventListener('resize', resize);

buildBackground();
resize();
updateNoise();

let lastT = performance.now();
function loop(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.1) dt = 0.1;
  if(dt < 0) dt = 0;
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
