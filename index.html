const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(a+Math.random()*(b-a+1));
const TAU = Math.PI*2;
function dist2(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; }
function dist(x1,y1,x2,y2){ return Math.sqrt(dist2(x1,y1,x2,y2)); }
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, len2=dx*dx+dy*dy;
  if(len2===0) return dist(px,py,x1,y1);
  let t = ((px-x1)*dx + (py-y1)*dy)/len2;
  t = clamp(t,0,1);
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function rr(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function txt(s,x,y,size,color,align,weight){
  ctx.font = (weight||'700') + ' ' + size + 'px "Segoe UI","Roboto",system-ui,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s,x,y);
}
function txtGrad(s,x,y,size,color1,color2,align){
  ctx.font = '800 ' + size + 'px "Segoe UI","Roboto",system-ui,sans-serif';
  const w = ctx.measureText(s).width;
  let sx = x;
  if(align==='center') sx = x-w/2;
  else if(align==='right') sx = x-w;
  const g = ctx.createLinearGradient(sx, y-size/2, sx, y+size/2);
  g.addColorStop(0, color1);
  g.addColorStop(1, color2);
  ctx.fillStyle = g;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, sx, y);
}
function inRect(mx,my,x,y,w,h){ return mx>=x && mx<=x+w && my>=y && my<=y+h; }
function formatTime(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

const Snd = (function(){
  let ac=null, master=null, sfxGain=null, musicGain=null, noiseBuf=null;
  let humOsc=null, humGain=null, humOn=false;
  let sirenOsc=null, sirenLfo=null, sirenGain=null, sirenOn=false;

  function init(){
    if(ac){ if(ac.state==='suspended'){ try{ac.resume();}catch(e){} } return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      ac = new AC();
      master = ac.createGain();
      master.gain.value = settings.volume;
      master.connect(ac.destination);
      sfxGain = ac.createGain(); sfxGain.gain.value = settings.sfxVolume;
      sfxGain.connect(master);
      musicGain = ac.createGain(); musicGain.gain.value = settings.musicVolume;
      musicGain.connect(master);
      const len = Math.floor(ac.sampleRate*1.5);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ac=null; }
  }
  function setVol(v){ settings.volume=v; if(master) master.gain.value=v; }
  function setSfx(v){ settings.sfxVolume=v; if(sfxGain) sfxGain.gain.value=v; }
  function setMusic(v){ settings.musicVolume=v; if(musicGain) musicGain.gain.value=v; }

  function blip(f1,f2,dur,type,g){
    if(!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type||'square';
    o.frequency.setValueAtTime(Math.max(20,f1), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(gn); gn.connect(sfxGain);
    o.start(t); o.stop(t+dur+0.03);
  }
  function noiseBurst(dur,g,freq,q){
    if(!ac||!noiseBuf) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type='bandpass';
    f.frequency.value = freq||800; f.Q.value = q||1;
    const gn = ac.createGain();
    gn.gain.setValueAtTime(g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(gn); gn.connect(sfxGain);
    s.start(t); s.stop(t+dur+0.02);
  }

  return {
    init, setVol, setSfx, setMusic,
    shoot(){ blip(900,220,0.09,'square',0.13); noiseBurst(0.06,0.06,2400,2); },
    revolver(){ blip(680,140,0.11,'square',0.14); noiseBurst(0.09,0.10,1800,1.5); },
    turret(){ blip(1400,500,0.05,'square',0.045); },
    hit(){ noiseBurst(0.07,0.10,700,2); },
    kill(){ blip(320,70,0.22,'sawtooth',0.10); noiseBurst(0.16,0.09,420,1); },
    buy(){ blip(620,1240,0.13,'sine',0.14); },
    err(){ blip(190,130,0.16,'square',0.11); },
    click(){ blip(760,760,0.04,'square',0.06); },
    gateBreak(){ blip(210,45,0.55,'sawtooth',0.18); noiseBurst(0.5,0.22,320,0.8); },
    coreHit(){ blip(140,60,0.3,'sawtooth',0.16); noiseBurst(0.25,0.14,260,0.9); },
    playerHit(){ blip(120,70,0.22,'sawtooth',0.16); },
    heartbeat(){ blip(62,40,0.16,'sine',0.30); setTimeout(()=>{ blip(56,36,0.18,'sine',0.22); }, 150); },
    alarmBeep(){ blip(880,880,0.10,'square',0.07); },
    artifact(){ blip(880,1760,0.25,'sine',0.16); blip(1320,2640,0.22,'sine',0.10); },
    artifactUp(){ blip(660,1980,0.35,'sine',0.18); blip(990,2970,0.3,'triangle',0.12); },
    dialog(){ blip(520,520,0.06,'sine',0.06); },
    mumble(){
      if(!ac) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(rnd(85,175), t);
      const gn = ac.createGain();
      gn.gain.setValueAtTime(0.024, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t+0.12);
      o.connect(gn); gn.connect(sfxGain);
      o.start(t); o.stop(t+0.14);
    },
    projectile(){ blip(320,180,0.08,'sawtooth',0.06); },
    allyShot(){ blip(680,340,0.06,'triangle',0.07); },
    step(){ blip(180,120,0.045,'triangle',0.025); },

    startHum(){
      if(!ac||humOn) return;
      humOsc = ac.createOscillator(); humOsc.type='sawtooth'; humOsc.frequency.value=47;
      const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=150;
      humGain = ac.createGain(); humGain.gain.value=0.0001;
      humOsc.connect(f); f.connect(humGain); humGain.connect(musicGain);
      humOsc.start();
      humGain.gain.linearRampToValueAtTime(0.055, ac.currentTime+1.2);
      humOn = true;
    },
    stopHum(){
      if(!humOsc) return;
      try{ humOsc.stop(ac.currentTime+0.2); }catch(e){}
      humOsc=null; humOn=false;
    },
    startSiren(){
      if(!ac||sirenOn) return;
      sirenOsc = ac.createOscillator(); sirenOsc.type='sawtooth'; sirenOsc.frequency.value=540;
      sirenLfo = ac.createOscillator(); sirenLfo.type='sine'; sirenLfo.frequency.value=0.8;
      const lg = ac.createGain(); lg.gain.value=170;
      sirenLfo.connect(lg); lg.connect(sirenOsc.frequency);
      sirenGain = ac.createGain(); sirenGain.gain.value=0.0001;
      sirenOsc.connect(sirenGain); sirenGain.connect(musicGain);
      sirenOsc.start(); sirenLfo.start();
      sirenGain.gain.linearRampToValueAtTime(0.045, ac.currentTime+0.6);
      sirenOn = true;
    },
    stopSiren(){
      if(!sirenOsc) return;
      try{ sirenOsc.stop(ac.currentTime+0.3); sirenLfo.stop(ac.currentTime+0.3); }catch(e){}
      sirenOsc=null; sirenLfo=null; sirenOn=false;
    },
    silenceAll(){ this.stopHum(); this.stopSiren(); }
  };
})();

function addArtifact(g, type){
  if(!g || g.artifacts.length >= g.maxArtifacts) return false;
  // Проверка на апгрейд
  if(g.artifacts.indexOf(type) >= 0){
    // Апгрейд!
    const idx = g.artifacts.indexOf(type);
    g.artifacts.splice(idx, 1);
    const upType = type + '_up';
    g.artifacts.push(upType);
    applyArtifactBonus(g, upType);
    return 'upgrade';
  }
  g.artifacts.push(type);
  applyArtifactBonus(g, type);
  return true;
}
function applyArtifactBonus(g, type){
  if(type==='capacitor') g.bonus.energyRegen += 0.6;
  if(type==='amplifier') g.bonus.turretDmg += 0.25;
  if(type==='shield')    g.bonus.coreArmor += 0.20;
  if(type==='stimulant') g.bonus.oxyBoost += 0.35;
  if(type==='resonator') g.bonus.enemySlow += 0.15;
  if(type==='capacitor_up') g.bonus.energyRegen += 1.2;
  if(type==='amplifier_up') g.bonus.turretDmg += 0.50;
  if(type==='shield_up')    g.bonus.coreArmor += 0.40;
  if(type==='stimulant_up') g.bonus.oxyBoost += 0.70;
  if(type==='resonator_up') g.bonus.enemySlow += 0.30;
}

function spawnParticle(x,y,vx,vy,life,size,color,shape,glow,gravity){
  for(let i=0;i<particlePool.length;i++){
    const p = particlePool[i];
    if(!p.active){
      p.active=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy;
      p.life=life; p.maxLife=life; p.size=size; p.color=color; p.drag=0.94;
      p.shape = shape||0;
      p.rot = Math.random()*TAU;
      p.rotSpeed = rnd(-8,8);
      p.glow = glow||false;
      p.gravity = gravity||0;
      return;
    }
  }
}
function burst(x,y,n,color,power,size,shape,glow,gravity){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU;
    const s = rnd(power*0.25, power);
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(0.25,0.85),rnd(size*0.5,size),color,shape,glow,gravity);
  }
}
function spawnBeam(x1,y1,x2,y2,color,width,life){
  for(let i=0;i<beamPool.length;i++){
    const b = beamPool[i];
    if(!b.active){
      b.active=true; b.x1=x1; b.y1=y1; b.x2=x2; b.y2=y2;
      b.color=color; b.width=width||2; b.life=life||0.14; b.maxLife=b.life;
      return;
    }
  }
}
function spawnProj(x,y,vx,vy,dmg,color,size,target,gateId){
  for(let i=0;i<projPool.length;i++){
    const p = projPool[i];
    if(!p.active){
      p.active=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy;
      p.life=3.5; p.dmg=dmg; p.color=color; p.size=size||4;
      p.target=target||'core'; p.gateId=gateId||'';
      return;
    }
  }
}

function buildBackground(){
  const c = bgCtx;
  c.fillStyle = '#04060a';
  c.fillRect(0,0,WORLD_W,WORLD_H);

  // сетка пола
  c.strokeStyle = 'rgba(30,64,88,0.10)';
  c.lineWidth = 1;
  c.beginPath();
  for(let x=0;x<=WORLD_W;x+=40){ c.moveTo(x+0.5,0); c.lineTo(x+0.5,WORLD_H); }
  for(let y=0;y<=WORLD_H;y+=40){ c.moveTo(0,y+0.5); c.lineTo(WORLD_W,y+0.5); }
  c.stroke();

  // коридоры — тень
  c.lineCap = 'round';
  for(const id in ROOMS){
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    c.strokeStyle = 'rgba(0,0,0,0.65)';
    c.lineWidth = 72;
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x,CORE.y); c.stroke();
  }
  // коридоры — основа
  for(const id in ROOMS){
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    c.strokeStyle = '#0d141c';
    c.lineWidth = 64;
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x,CORE.y); c.stroke();
  }
  // коридоры — блик
  for(const id in ROOMS){
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    c.strokeStyle = 'rgba(60,140,180,0.16)';
    c.lineWidth = 50;
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x,CORE.y); c.stroke();
  }
  // направляющие полосы по центру коридоров
  for(const id in ROOMS){
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    c.strokeStyle = 'rgba(120,180,220,0.22)';
    c.lineWidth = 1.5;
    c.setLineDash([14,18]);
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(CORE.x,CORE.y); c.stroke();
    c.setLineDash([]);
  }

  // комнаты
  for(const id in ROOMS){
    const r = ROOMS[id];

    // тень комнаты
    c.save();
    c.shadowColor = 'rgba(0,0,0,0.75)';
    c.shadowBlur = 16;
    c.shadowOffsetY = 4;
    c.fillStyle = '#0b111a';
    rr(c, r.x, r.y, r.w, r.h, 8); c.fill();
    c.restore();

    // градиент глубины
    const grad = c.createLinearGradient(0, r.y, 0, r.y+r.h);
    grad.addColorStop(0, 'rgba(70,140,180,0.08)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.3)');
    c.fillStyle = grad;
    rr(c, r.x, r.y, r.w, r.h, 8); c.fill();

    // рамка
    c.strokeStyle = 'rgba(44,84,110,0.9)';
    c.lineWidth = 2;
    rr(c, r.x, r.y, r.w, r.h, 8); c.stroke();

    // угловые засечки
    c.strokeStyle = 'rgba(90,190,230,0.6)';
    c.lineWidth = 2;
    const t = 16;
    c.beginPath();
    c.moveTo(r.x+5, r.y+5+t); c.lineTo(r.x+5, r.y+5); c.lineTo(r.x+5+t, r.y+5);
    c.moveTo(r.x+r.w-5-t, r.y+5); c.lineTo(r.x+r.w-5, r.y+5); c.lineTo(r.x+r.w-5, r.y+5+t);
    c.moveTo(r.x+5, r.y+r.h-5-t); c.lineTo(r.x+5, r.y+r.h-5); c.lineTo(r.x+5+t, r.y+r.h-5);
    c.moveTo(r.x+r.w-5-t, r.y+r.h-5); c.lineTo(r.x+r.w-5, r.y+r.h-5); c.lineTo(r.x+r.w-5, r.y+r.h-5-t);
    c.stroke();

    // внутренняя сетка пола
    c.strokeStyle = 'rgba(40,80,110,0.20)';
    c.lineWidth = 1;
    c.beginPath();
    for(let gx=r.x+24; gx<r.x+r.w-8; gx+=24){ c.moveTo(gx+0.5, r.y+8); c.lineTo(gx+0.5, r.y+r.h-8); }
    for(let gy=r.y+24; gy<r.y+r.h-8; gy+=24){ c.moveTo(r.x+8, gy+0.5); c.lineTo(r.x+r.w-8, gy+0.5); }
    c.stroke();

    // декор
    drawRoomDecor(c, r, id);

    // заголовок
    c.font = 'bold 12px "Segoe UI","Roboto",system-ui,sans-serif';
    c.fillStyle = 'rgba(120,200,235,0.85)';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(r.name, r.x+r.w/2, r.y+13);
  }
}

function drawRoomDecor(c, room, id){
  // ящики
  const crateCols = ['#3a3020','#2a2010','#403520','#352a15'];
  const nCrates = 2 + (id.length % 2);
  for(let i=0;i<nCrates;i++){
    const cx = room.x + 18 + i*28;
    const cy = room.y + room.h - 40;
    const cw = 22, ch = 22;
    c.fillStyle = crateCols[i%4];
    c.fillRect(cx, cy, cw, ch);
    c.strokeStyle = 'rgba(90,70,40,0.8)';
    c.lineWidth = 1;
    c.strokeRect(cx+0.5, cy+0.5, cw-1, ch-1);
    c.strokeStyle = 'rgba(90,70,40,0.5)';
    c.beginPath();
    c.moveTo(cx+4, cy+4); c.lineTo(cx+cw-4, cy+ch-4);
    c.moveTo(cx+cw-4, cy+4); c.lineTo(cx+4, cy+ch-4);
    c.stroke();
  }

  // терминалы
  if(id === 'core' || id === 'gen' || id === 'oxy' || id === 'lab' || id === 'work'){
    for(let i=0;i<3;i++){
      const tx = room.x + room.w - 30 - i*24;
      const ty = room.y + 22;
      const tw = 18, th = 24;
      c.fillStyle = '#0e1a26';
      c.fillRect(tx, ty, tw, th);
      c.strokeStyle = 'rgba(90,180,220,0.7)';
      c.lineWidth = 1;
      c.strokeRect(tx+0.5, ty+0.5, tw-1, th-1);
      c.fillStyle = 'rgba(90,220,255,0.8)';
      c.fillRect(tx+3, ty+5, tw-6, 2);
      c.fillRect(tx+3, ty+9, tw-6, 2);
      c.fillRect(tx+3, ty+13, tw-6, 2);
      c.fillStyle = 'rgba(255,80,80,0.9)';
      c.fillRect(tx+3, ty+18, 3, 2);
      c.fillStyle = 'rgba(80,255,120,0.9)';
      c.fillRect(tx+8, ty+18, 3, 2);
    }
  }

  // предупреждающие полосы
  if(id === 'gen' || id === 'vent' || id === 'gateA' || id === 'gateB' || id === 'gateC'){
    const sy = room.y + room.h - 14;
    c.fillStyle = 'rgba(255,180,60,0.55)';
    for(let i=0;i<Math.floor(room.w/12);i++){
      c.fillRect(room.x + 10 + i*12, sy, 6, 4);
    }
  }

  // трубы в углах
  if(id === 'gen' || id === 'oxy'){
    c.strokeStyle = 'rgba(90,110,130,0.5)';
    c.lineWidth = 5;
    c.beginPath();
    c.moveTo(room.x+6, room.y+room.h/2);
    c.lineTo(room.x+6, room.y+6);
    c.lineTo(room.x+room.w/2, room.y+6);
    c.stroke();
    c.strokeStyle = 'rgba(140,160,180,0.25)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(room.x+7, room.y+room.h/2);
    c.lineTo(room.x+7, room.y+7);
    c.lineTo(room.x+room.w/2, room.y+7);
    c.stroke();
  }

  // сейфы/контейнеры
  if(id === 'cargo' || id === 'arm'){
    for(let i=0;i<3;i++){
      const bx = room.x + room.w - 45;
      const by = room.y + 20 + i*32;
      c.fillStyle = '#1a2028';
      c.fillRect(bx, by, 32, 26);
      c.strokeStyle = 'rgba(90,140,180,0.7)';
      c.lineWidth = 1.2;
      c.strokeRect(bx+0.5, by+0.5, 31, 25);
      c.fillStyle = 'rgba(255,200,80,0.8)';
      c.fillRect(bx+4, by+4, 4, 2);
      c.fillStyle = 'rgba(90,140,180,0.7)';
      c.fillRect(bx+4, by+12, 24, 1);
      c.fillRect(bx+4, by+18, 18, 1);
    }
  }

  // медблок — койка
  if(id === 'med'){
    c.fillStyle = '#2a3a4a';
    c.fillRect(room.x+16, room.y+20, 40, 18);
    c.strokeStyle = 'rgba(200,220,240,0.4)';
    c.lineWidth = 1;
    c.strokeRect(room.x+16.5, room.y+20.5, 39, 17);
    c.fillStyle = '#88aabb';
    c.fillRect(room.x+18, room.y+22, 36, 3);
  }
}

(function(){

  const g = v.createRadialGradient(VIEW_W/2,VIEW_H/2, Math.min(VIEW_W,VIEW_H)*0.35, VIEW_W/2,VIEW_H/2, Math.max(VIEW_W,VIEW_H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');

})();

let glitchTimer = 0, glitchY = 0, glitchH = 0;
function drawCRTOverlay(alpha){
  ctx.save();
  ctx.fillStyle = scanPattern;
  ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = alpha===undefined?0.35:alpha;
  ctx.drawImage(noiseCanvas,0,0,VIEW_W,VIEW_H);
  ctx.imageSmoothingEnabled = true;

  glitchTimer -= 0.016;
  if(glitchTimer <= 0){
    glitchTimer = rnd(1.5, 4.5);
    if(Math.random() < 0.4){
      glitchY = rnd(0, VIEW_H-40);
      glitchH = rnd(4, 30);
    } else { glitchH = 0; }
  }
  if(glitchH > 0){
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#5ad1ff';
    ctx.fillRect(0, glitchY, VIEW_W, glitchH);
    ctx.fillStyle = 'rgba(255,90,122,0.4)';
    ctx.fillRect(rnd(-10,10), glitchY, VIEW_W, glitchH);
  }
  ctx.globalAlpha = 1;
  ctx.drawImage(vignetteCanvas, 0, 0);
  ctx.restore();
}

function finishGame(win){
  if(!game || game.over) return;
  game.over = true;
  game.victory = win;
  Snd.silenceAll();
  if(game.mode==='endless'){
    const b = bestRecord();

function pickEnemyType(prog){
  const r = Math.random();
  if(prog < 0.15) return r<0.85 ? 'parasite':'drone';
  if(prog < 0.32) return r<0.55?'parasite':(r<0.75?'crawler':(r<0.92?'drone':'stealth'));
  if(prog < 0.55) return r<0.35?'parasite':(r<0.55?'crawler':(r<0.72?'drone':(r<0.88?'stealth':'shooter')));
  if(prog < 0.78) return r<0.22?'parasite':(r<0.40?'crawler':(r<0.58?'drone':(r<0.74?'stealth':(r<0.88?'shooter':'brute'))));
  return r<0.15?'parasite':(r<0.30?'crawler':(r<0.48?'drone':(r<0.64?'stealth':(r<0.82?'shooter':'brute'))));
}

function spawnEnemy(){
  const G = game;
  let e = null;
  for(let i=0;i<enemyPool.length;i++){ if(!enemyPool[i].active){ e = enemyPool[i]; break; } }
  if(!e) return;

  const type = pickEnemyType(G.progress);
  const def = ENEMY_DEFS[type];
  const gateId = GATE_IDS[rndi(0,3)];
  const gd = GATE_DATA[gateId];

  let hpMul = 1 + G.progress*0.9;
  let spMul = 1;
  if(G.mode==='hardcore'){ hpMul *= 1.28; spMul = 1.30; }

  e.active = true;
  e.type = type;
  e.x = gd.spawn.x + rnd(-10,10);
  e.y = gd.spawn.y + rnd(-10,10);
  e.hp = def.hp * hpMul;
  e.maxHp = e.hp;
  e.speed = def.speed * spMul * rnd(0.9,1.12);
  e.dmg = def.dmg;
  e.atk = def.atk;
  e.atkCd = rnd(0,0.4);
  e.size = def.size;
  e.color = def.color;
  e.reward = def.reward;
  e.gateId = gateId;
  e.inside = false;
  e.angle = 0;
  e.anim = Math.random()*TAU;
  e.flash = 0;
  e.slow = 0;
  e.spawnT = 0.25;
  e.cloaked = false;
  e.cloakT = type==='stealth' ? rnd(1.0,2.0) : 0;
  e.zigzag = !!def.zigzag;
  e.ranged = !!def.ranged;
  e.range = def.range || 0;
  e.zigPhase = Math.random()*TAU;

  if(def.swarm && Math.random() < 0.55){
    for(let k=0;k<2;k++){
      let e2 = null;
      for(let i=0;i<enemyPool.length;i++){ if(!enemyPool[i].active){ e2 = enemyPool[i]; break; } }
      if(!e2) break;
      e2.active = true; e2.type = type;
      e2.x = e.x + rnd(-16,16); e2.y = e.y + rnd(-16,16);
      e2.hp = def.hp*hpMul; e2.maxHp = e2.hp;
      e2.speed = def.speed*spMul*rnd(0.9,1.1);
      e2.dmg = def.dmg; e2.atk = def.atk; e2.atkCd = rnd(0,0.4);
      e2.size = def.size; e2.color = def.color; e2.reward = def.reward;
      e2.gateId = gateId; e2.inside = false; e2.angle = 0;
      e2.anim = Math.random()*TAU; e2.flash = 0; e2.slow = 0; e2.spawnT = 0.25;
      e2.cloaked = false; e2.cloakT = 0;
      e2.zigzag = true; e2.ranged = false; e2.range = 0;
      e2.zigPhase = Math.random()*TAU;
    }
  }
}

function damageEnemy(e, dmg, splashColor){
  if(!e.active) return;
  e.hp -= dmg;
  e.flash = 0.12;
  burst(e.x, e.y, 3, splashColor||e.color, 90, 2.2, 0, true, 40);
  if(e.hp <= 0) killEnemy(e);
  else Snd.hit();
}
function killEnemy(e){
  const G = game;
  e.active = false;
  G.credits += e.reward;
  G.stats.kills++;
  burst(e.x, e.y, 18, e.color, 200, 3.5, 0, true, 60);
  burst(e.x, e.y, 8, '#ffffff', 150, 2.2, 1, true, 20);
  Snd.kill();
  if(Math.random() < 0.10 && G.floatingArtifacts.length < 6 && G.artifacts.length < G.maxArtifacts){
    const type = ARTIFACT_KEYS[rndi(0, ARTIFACT_KEYS.length-1)];
    G.floatingArtifacts.push({ x:e.x, y:e.y, type, anim:0 });
  }
}

function fireAt(worldMX, worldMY){
  const G = game;
  if(!G || G.over) return;
  if(G.fireCd > 0) return;
  const w = WEAPONS[G.weapon];
  if(G.energy < w.cost){ Snd.err(); return; }

  G.energy -= w.cost;
  G.stats.energySpent += w.cost;
  G.fireCd = w.cd;
  G.player.shootFlash = 0.08;
  G.tutorial.flags.shot = true;

  const angle = G.player.angle;
  const px = G.player.x, py = G.player.y;

  if(w.id === 'shotgun'){
    for(let k=-1;k<=1;k++){
      const a = angle + k*0.16;
      fireRay(px, py, a, w.dmg, w.color, 260, 22);
      Snd.revolver();
    }
  } else if(w.id === 'emp'){
    const hit = fireRay(px, py, angle, w.dmg, w.color, 400, 30);
    if(hit){
      // цепная молния
      let chain = 0;
      for(const e of enemyPool){
        if(!e.active || e === hit || e.cloaked) continue;
        if(dist(e.x, e.y, hit.x, hit.y) < 120 && chain < 3){
          spawnBeam(hit.x, hit.y, e.x, e.y, '#a97bff', 1.5, 0.14);
          damageEnemy(e, w.dmg*0.55, w.color);
          chain++;
        }
      }
    }
    Snd.shoot();
  } else if(w.id === 'plasma'){
    const hit = fireRay(px, py, angle, w.dmg, w.color, 400, 28);
    if(hit){
      burst(hit.x, hit.y, 20, w.color, 260, 3.5, 0, true, 30);
      for(const e of enemyPool){
        if(!e.active || e === hit || e.cloaked) continue;
        if(dist2(e.x, e.y, hit.x, hit.y) < 70*70) damageEnemy(e, w.dmg*0.45, w.color);
      }
    }
    Snd.shoot();
  } else {
    fireRay(px, py, angle, w.dmg, w.color, 400, 26);
    Snd.revolver();
  }
}

function fireRay(px, py, angle, dmg, color, range, tolerance){
  const G = game;
  const ca = Math.cos(angle), sa = Math.sin(angle);
  let best = null, bestProj = range;
  for(const e of enemyPool){
    if(!e.active || e.cloaked) continue;
    const dx = e.x - px, dy = e.y - py;
    const proj = dx*ca + dy*sa;
    if(proj < 0 || proj > bestProj) continue;
    const perp = Math.abs(-dx*sa + dy*ca);
    if(perp < e.size + tolerance){
      bestProj = proj;
      best = e;
    }
  }
  const endX = best ? best.x : px + ca*range;
  const endY = best ? best.y : py + sa*range;
  spawnBeam(px, py, endX, endY, color, 2.4, 0.12);
  burst(endX, endY, 4, color, 120, 2.4, 0, true, 30);
  if(best) damageEnemy(best, dmg, color);
  return best;
}

}
function boostOxygen(){

function buyTurret(gateId){
  const G = game;
  if(G.turrets.some(t=>t.gateId===gateId)) return false;
  const cost = 175;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  const s = TURRET_SLOTS[gateId];
  G.turrets.push({ gateId, x:s.x, y:s.y, cd:0, angle:0 });
  Snd.buy(); return true;
}
function buyLaser(gateId){
  const G = game;
  const lv = G.lasers.filter(l=>l.gateId===gateId).length;
  if(lv >= 3) return false;
  const cost = 115 + lv*45;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  G.lasers.push({ gateId, cd:0 });
  Snd.buy(); return true;
}
function buyBlocker(){
  const G = game;
  if(G.blocker) return false;
  const cost = 160;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  G.blocker = true; Snd.buy(); return true;
}
function buyWeapon(i){
  const G = game;
  if(G.unlocked[i]) return false;
  const cost = WEAPONS[i].price;
  if(G.credits < cost){ Snd.err(); return false; }
  G.credits -= cost; G.stats.spent += cost;
  G.unlocked[i] = true;
  G.weapon = i;
  Snd.buy(); return true;
}
function buyUpgrade(key){
  const G = game;
  if(key==='gen'){
    if(G.upgrades.gen >= 3) return false;
    const cost = [230, 400, 640][G.upgrades.gen];
    if(G.credits < cost){ Snd.err(); return false; }
    G.credits -= cost; G.stats.spent += cost;
    G.upgrades.gen++; G.stats.upgradesBought++;
    Snd.buy(); return true;
  }
  if(key==='autoRepair'){
    if(G.upgrades.autoRepair > 0) return false;
    const cost = 350;
    if(G.credits < cost){ Snd.err(); return false; }
    G.credits -= cost; G.stats.spent += cost;
    G.upgrades.autoRepair = 1; G.stats.upgradesBought++;
    Snd.buy(); return true;
  }
  if(key==='scanner'){
    if(G.upgrades.scanner > 0) return false;
    const cost = 190;
    if(G.credits < cost){ Snd.err(); return false; }
    G.credits -= cost; G.stats.spent += cost;
    G.upgrades.scanner = 1; G.stats.upgradesBought++;
    Snd.buy(); return true;
  }
  return false;
}

/* ============================================================
   ОБНОВЛЕНИЕ ИГРЫ
   ============================================================ */
function updateGame(dt){
  const G = game;
  if(!G || G.over) return;

  G.time += dt;
  const totalMin = G.time/60;
  const hour = (22 + Math.floor(totalMin)) % 24;
  const minute = Math.floor((totalMin % 1)*60);
  G.clock = (hour<10?'0':'')+hour+':'+(minute<10?'0':'')+minute;

  let prog;
  if(G.mode==='endless') prog = Math.min(1, G.time/620);
  else prog = Math.min(1, G.time/480);
  G.progress = prog;
  G.danger = 1 + Math.floor(prog*9);
  G.wave = 1 + Math.floor(G.time/45);

  if(G.mode!=='endless' && G.time >= 480){ finishGame(true); return; }

  if(G.fireCd > 0) G.fireCd -= dt;
  if(G.rebootCd > 0) G.rebootCd -= dt;
  if(G.repairCd > 0) G.repairCd -= dt;
  if(G.oxygenCd > 0) G.oxygenCd -= dt;
  if(G.allyShootCd > 0) G.allyShootCd -= dt;
  if(G.stepSoundCd > 0) G.stepSoundCd -= dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*22);
  if(G.flashRed > 0) G.flashRed = Math.max(0, G.flashRed - dt*2.4);
  if(G.player.shootFlash > 0) G.player.shootFlash -= dt;

  updatePlayer(dt, G);
  updateCamera(G, dt);

  // энергия
  let regen = 4.2 + G.upgrades.gen*1.6 + G.bonus.energyRegen;
  if(G.mode==='hardcore') regen *= 0.5;
  let drain = 0.85 + G.turrets.length*0.62 + G.lasers.length*0.28 + (G.blocker?0.35:0);
  G.energy = clamp(G.energy + (regen - drain)*dt, 0, G.energyMax);

  // кислород
  let oxyDrain = G.mode==='hardcore' ? 0.44 : 0.30;
  if(G.energy <= 1) oxyDrain += 1.1;
  G.oxygen -= oxyDrain*dt;
  G.oxygen = clamp(G.oxygen, 0, 100);
  if(G.oxygen <= 0){
    G.coreHP -= 5.5*dt;
    G.flashRed = Math.min(1, G.flashRed + dt*2);
  }

  if(G.upgrades.autoRepair > 0){
    for(const id of GATE_IDS){
      const g = G.gates[id];
      if(g.hp > 0 && g.hp < g.max) g.hp = clamp(g.hp + 1.4*dt, 0, g.max);
    }
  }

  G.spawnTimer -= dt;
  if(G.spawnTimer <= 0){
    spawnEnemy();
    let base = G.mode==='hardcore' ? 2.15 : 2.95;
    let interval = lerp(base, 0.78, prog) * rnd(0.72,1.28);
    if(G.mode==='hardcore') interval *= 0.78;
    G.spawnTimer = Math.max(0.45, interval);
  }

  // инженер-союзник стреляет
  const engineer = G.allies.find(a=>a.id==='engineer');
  if(engineer && engineer.met && G.allyShootCd <= 0){
    let target = null, bd = 260*260;
    for(let i=0;i<enemyPool.length;i++){
      const e = enemyPool[i];
      if(!e.active || e.cloaked) continue;
      const d = dist2(e.x,e.y,engineer.x,engineer.y);
      if(d < bd){ bd = d; target = e; }
    }
    if(target){
      G.allyShootCd = 1.8;
      spawnBeam(engineer.x, engineer.y, target.x, target.y, '#ffcf4a', 1.5, 0.1);
      damageEnemy(target, 10, '#ffcf4a');
      Snd.allyShot();
    }
  }

  // враги
  const coreStop = 84;
  const globalSlow = 1 - G.bonus.enemySlow;
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active) continue;

    e.anim += dt;
    if(e.flash > 0) e.flash -= dt;
    if(e.slow > 0) e.slow -= dt;
    if(e.spawnT > 0) e.spawnT -= dt;

    if(e.type === 'stealth'){
      e.cloakT -= dt;
      if(e.cloakT <= 0){
        e.cloaked = !e.cloaked;
        e.cloakT = e.cloaked ? rnd(1.1,1.8) : rnd(2.2,3.2);
      }
    }

    // атака игрока если он близко
    const dToPlayer = dist2(e.x, e.y, G.player.x, G.player.y);
    if(dToPlayer < 42*42 && !e.cloaked){
      e.atkCd -= dt;
      if(e.atkCd <= 0){
        e.atkCd = e.atk;
        const dmg = e.dmg * 0.55 * (1 - G.bonus.coreArmor*0.4);
        G.player.hp -= dmg;
        G.stats.damageTaken += dmg;
        G.shake = Math.min(9, G.shake + 2);
        G.flashRed = Math.min(1, G.flashRed + 0.3);
        burst(e.x, e.y, 6, '#ff6a4a', 120, 2.4, 0, true, 30);
        Snd.playerHit();
        if(G.player.hp <= 0){ G.player.hp = 0; finishGame(false); return; }
      }
      continue;
    }

    const gd = GATE_DATA[e.gateId];
    const gate = G.gates[e.gateId];
    const spd = e.speed * (e.slow>0 ? 0.45 : 1) * globalSlow;

    // ranged — стреляет с дистанции
    if(e.ranged && !e.inside){
      const dToCore = dist(e.x, e.y, CORE.x, CORE.y);
      if(dToCore < e.range){
        e.atkCd -= dt;
        if(e.atkCd <= 0){
          e.atkCd = e.atk;
          const a = Math.atan2(CORE.y-e.y, CORE.x-e.x);
          spawnProj(e.x, e.y, Math.cos(a)*300, Math.sin(a)*300, 12, e.color, 5, 'core', '');
          Snd.projectile();
        }
        continue;
      }
    }

    let tx, ty, targetKind;
    if(!e.inside){
      if(gate.hp > 0){ tx = gd.breach.x; ty = gd.breach.y; targetKind='gate'; }
      else { e.inside = true; targetKind='core'; tx = CORE.x; ty = CORE.y; }
    } else { targetKind='core'; tx = CORE.x; ty = CORE.y; }

    if(targetKind === 'core'){
      const d = dist(e.x,e.y,CORE.x,CORE.y);
      if(d <= coreStop){
        e.atkCd -= dt;
        if(e.atkCd <= 0){
          e.atkCd = e.atk;
          const dmg = e.dmg * (1 - G.bonus.coreArmor*0.5);
          G.coreHP -= dmg;
          G.shake = Math.min(9, G.shake + 2.2);
          G.flashRed = Math.min(1, G.flashRed + 0.35);
          burst(e.x, e.y, 6, '#ff4a4a', 140, 2.6, 0, true, 30);
          Snd.coreHit();
          if(G.coreHP <= 0){ G.coreHP = 0; finishGame(false); return; }
        }
      } else {
        const dx = CORE.x-e.x, dy = CORE.y-e.y;
        let nx = dx/d, ny = dy/d;
        if(e.zigzag){
          e.zigPhase += dt*6;
          const pn = Math.sin(e.zigPhase)*0.6;
          const px = -ny, py = nx;
          nx += px*pn; ny += py*pn;
          const nl = Math.sqrt(nx*nx+ny*ny); nx/=nl; ny/=nl;
        }
        const step = Math.min(d - coreStop, spd*dt);
        e.x += nx*step; e.y += ny*step;
        e.angle = Math.atan2(ny,nx);
      }
    } else {
      const d = dist(e.x,e.y,tx,ty);
      if(d <= 3){
        e.atkCd -= dt;
        if(e.atkCd <= 0){
          e.atkCd = e.atk;
          let dmg = e.dmg;
          if(G.blocker) dmg *= 0.55;
          gate.hp -= dmg;
          burst(e.x, e.y, 4, '#ffae4a', 110, 2.2, 0, true, 20);
          Snd.hit();
          if(gate.hp <= 0){
            gate.hp = 0;
            if(!gate.broken){
              gate.broken = true;
              Snd.gateBreak();
              G.shake = 12;
              burst(gd.cx, gd.cy, 28, '#ff5a3b', 240, 3.5, 0, true, 50);
            }
          }
        }
      } else {
        const dx = tx-e.x, dy = ty-e.y;
        let nx = dx/d, ny = dy/d;
        if(e.zigzag){
          e.zigPhase += dt*6;
          const pn = Math.sin(e.zigPhase)*0.6;
          const px = -ny, py = nx;
          nx += px*pn; ny += py*pn;
          const nl = Math.sqrt(nx*nx+ny*ny); nx/=nl; ny/=nl;
        }
        const step = Math.min(d, spd*dt);
        e.x += nx*step; e.y += ny*step;
        e.angle = Math.atan2(ny,nx);
      }
    }
    if(G.blocker && !e.inside) e.slow = Math.max(e.slow, 0.1);
  }

  for(const id of GATE_IDS){
    const g = G.gates[id];
    if(g.hp > 0 && g.broken) g.broken = false;
  }

  // турели
  const turretDmgMul = 1 + G.bonus.turretDmg;
  for(let i=0;i<G.turrets.length;i++){
    const t = G.turrets[i];
    t.cd -= dt;
    if(t.cd > 0) continue;
    let best = null, bestD = 320*320;
    for(let j=0;j<enemyPool.length;j++){
      const e = enemyPool[j];
      if(!e.active || e.cloaked) continue;
      const d = dist2(e.x,e.y,t.x,t.y);
      if(d < bestD){ bestD = d; best = e; }
    }
    if(best && G.energy >= 1.6){
      t.cd = 0.42;
      t.angle = Math.atan2(best.y-t.y, best.x-t.x);
      G.energy -= 1.6;
      spawnBeam(t.x, t.y, best.x, best.y, '#7fe9ff', 1.6, 0.1);
      damageEnemy(best, 13*turretDmgMul, '#7fe9ff');
      Snd.turret();
    }
  }
  // лазеры
  for(let i=0;i<G.lasers.length;i++){
    const l = G.lasers[i];
    l.cd -= dt;
    if(l.cd > 0) continue;
    l.cd = 0.55;
    const gd = GATE_DATA[l.gateId];
    for(let j=0;j<enemyPool.length;j++){
      const e = enemyPool[j];
      if(!e.active) continue;
      if(dist2(e.x,e.y,gd.breach.x,gd.breach.y) < 90*90) damageEnemy(e, 9, '#ff4a9a');
    }
    burst(gd.breach.x, gd.breach.y, 4, '#ff4a9a', 80, 2, 0, true, 0);
  }

  // снаряды
  for(let i=0;i<projPool.length;i++){
    const p = projPool[i];
    if(!p.active) continue;
    p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.life <= 0 || p.x < -20 || p.x > WORLD_W+20 || p.y < -20 || p.y > WORLD_H+20){
      p.active = false; continue;
    }
    if(p.target === 'core'){
      if(dist2(p.x,p.y,CORE.x,CORE.y) < 34*34){
        G.coreHP -= p.dmg * (1 - G.bonus.coreArmor*0.5);
        G.shake = Math.min(9, G.shake + 1.5);
        burst(p.x, p.y, 8, p.color, 140, 2.6, 0, true, 0);
        Snd.coreHit();
        p.active = false;
        if(G.coreHP <= 0){ G.coreHP = 0; finishGame(false); return; }
      }
    }
  }

  // плавающие артефакты
  for(const a of G.floatingArtifacts) a.anim += dt;
  // плавающие тексты
  for(let i=G.floatingTexts.length-1;i>=0;i--){
    const f = G.floatingTexts[i];
    f.life -= dt;
    f.y -= 30*dt;
    if(f.life <= 0) G.floatingTexts.splice(i,1);
  }

  // тревоги
  G.alarmT -= dt;
  const critical = G.coreHP < 45 || G.oxygen < 20 || G.player.hp < 35;
  const breached = GATE_IDS.some(id=>G.gates[id].hp<=0);
  if((critical || breached) && G.alarmT <= 0){
    G.alarmT = 2.2;
    Snd.alarmBeep();
  }
  G.heartbeatT -= dt;
  if(G.heartbeatT <= 0 && (G.coreHP < 55 || G.player.hp < 40)){
    G.heartbeatT = (G.coreHP < 25 || G.player.hp < 25) ? 0.75 : 1.25;
    Snd.heartbeat();
  }

  if(G.coreHP <= 0){ G.coreHP = 0; finishGame(false); }

  // Обучение
  if(G.tutorial.active && !G.tutorial.done){
    const step = TUT_STEPS[G.tutorial.step];
    if(step && G.tutorial.flags[step.key]){
      G.tutorial.step++;
      if(G.tutorial.step >= TUT_STEPS.length){
        G.tutorial.done = true;
        G.tutorial.active = false;
        Snd.buy();
      }
    }
  }
}

function canMoveTo(x, y){
  // в комнате?
  for(const id in ROOMS){
    const r = ROOMS[id];
    if(x >= r.x+4 && x <= r.x+r.w-4 && y >= r.y+4 && y <= r.y+r.h-4) return true;
  }
  // в коридоре?
  for(const id in ROOMS){
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    if(distSeg(x, y, cx, cy, CORE.x, CORE.y) < 30) return true;
  }
  return false;
}

function updatePlayer(dt, G){
  const p = G.player;
  let dx = 0, dy = 0;
  if(keys['w'] || keys['ArrowUp'] || keys['ц'] || keys['Ц']) dy -= 1;
  if(keys['s'] || keys['ArrowDown'] || keys['ы'] || keys['Ы']) dy += 1;
  if(keys['a'] || keys['ArrowLeft'] || keys['ф'] || keys['Ф']) dx -= 1;
  if(keys['d'] || keys['ArrowRight'] || keys['в'] || keys['В']) dx += 1;
  const len = Math.hypot(dx,dy);
  if(len > 0){ dx /= len; dy /= len; }

  p.moving = len > 0;
  if(p.moving){
    p.walkPhase += dt*10;
    const nx = p.x + dx * p.speed * dt;
    if(canMoveTo(nx, p.y)) p.x = nx;
    const ny = p.y + dy * p.speed * dt;
    if(canMoveTo(p.x, ny)) p.y = ny;
    p.x = clamp(p.x, 10, WORLD_W-10);
    p.y = clamp(p.y, 10, WORLD_H-10);
    if(!G.tutorial.flags.moved) G.tutorial.flags.moved = true;
    if(G.stepSoundCd <= 0){ Snd.step(); G.stepSoundCd = 0.32; }
  }

  // поворот к мыши
  const wmx = mouse.x + G.camera.x;
  const wmy = mouse.y + G.camera.y;
  p.angle = Math.atan2(wmy - p.y, wmx - p.x);
}

function updateCamera(G, dt){
  const targetX = G.player.x - VIEW_W/2;
  const targetY = G.player.y - VIEW_H/2;
  const k = 1 - Math.pow(0.001, dt);
  G.camera.x = lerp(G.camera.x, targetX, k);
  G.camera.y = lerp(G.camera.y, targetY, k);
  G.camera.x = clamp(G.camera.x, 0, WORLD_W - VIEW_W);
  G.camera.y = clamp(G.camera.y, 0, WORLD_H - VIEW_H);
}

function updateEffects(dt){
  for(let i=0;i<particlePool.length;i++){
    const p = particlePool[i];
    if(!p.active) continue;
    p.life -= dt;
    if(p.life <= 0){ p.active = false; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += p.gravity*dt;
    p.vx *= Math.pow(p.drag, dt*60);
    p.vy *= Math.pow(p.drag, dt*60);
    p.rot += p.rotSpeed*dt;
  }
  for(let i=0;i<beamPool.length;i++){
    const b = beamPool[i];
    if(!b.active) continue;
    b.life -= dt;
    if(b.life <= 0) b.active = false;
  }
}

function roomStatusColor(id){
  const G = game;
  if(!G) return '#39d4ff';
  if(id === 'core'){ return G.coreHP < 30 ? '#ff3b3b' : (G.coreHP < 60 ? '#ff9a3b' : '#39d4ff'); }
  if(id === 'gen') return G.energy > 22 ? '#ffcf4a' : '#ff5a5a';
  if(id === 'oxy') return G.oxygen > 28 ? '#4affd0' : '#ff5a5a';
  if(id === 'arm') return '#ffa54a';
  if(id === 'lab') return '#a97bff';
  if(id === 'cargo') return '#ffb45a';
  if(id === 'work') return '#ffcf4a';
  if(id === 'med') return '#8dffb0';
  if(id === 'vent'){ return G.gates.vent.hp > 0 ? '#b06bff' : '#ff3b3b'; }
  const g = G.gates[id];
  if(!g) return '#39d4ff';
  if(g.hp <= 0) return '#ff3b3b';
  if(g.hp < 35) return '#ff8a3b';
  return '#3bff9e';
}

function drawWorldLayer(){
  const G = game;
  if(!G) return;
  const pulse = 0.55 + 0.45*Math.sin(T*3.2);

  // пульсирующие обводки комнат
  for(const id in ROOMS){
    const r = ROOMS[id];
    const col = roomStatusColor(id);
    ctx.save();
    ctx.globalAlpha = 0.08 + 0.05*pulse;
    ctx.fillStyle = col;
    rr(ctx, r.x, r.y, r.w, r.h, 8); ctx.fill();
    ctx.globalAlpha = 0.55 + 0.25*pulse;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    rr(ctx, r.x, r.y, r.w, r.h, 8); ctx.stroke();
    ctx.restore();
  }

  // выделение выбранного сектора
  const sec = SECTORS[G.sector];
  if(sec){
    ctx.save();
    ctx.strokeStyle = 'rgba(120,230,255,'+(0.5+0.3*Math.sin(T*4))+')';
    ctx.lineWidth = 2;
    ctx.setLineDash([10,8]);
    for(const rid of sec.rooms){
      const r = ROOMS[rid];
      rr(ctx, r.x-8, r.y-8, r.w+16, r.h+16, 12);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  // световые пятна от важных комнат
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const lights = [
    { room: ROOMS.gen, color: '#ffcf4a', intensity: G.energy/100 },
    { room: ROOMS.oxy, color: '#4affd0', intensity: G.oxygen/100 },
    { room: ROOMS.core, color: '#39d4ff', intensity: G.coreHP/100 }
  ];
  for(const l of lights){
    const cx = l.room.x + l.room.w/2;
    const cy = l.room.y + l.room.h/2;
    const r = Math.max(l.room.w, l.room.h) * 0.9;
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0, l.color + '55');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(T*2 + l.intensity);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
  }
  // предупреждающие мигания шлюзов
  for(const id of GATE_IDS){
    const g = G.gates[id];
    const r = ROOMS[id];
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    if(g.hp <= 0){
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,70);
      grad.addColorStop(0, 'rgba(255,50,50,0.6)');
      grad.addColorStop(1, 'rgba(255,50,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,70,0,TAU); ctx.fill();
    } else if(g.hp < 40){
      const blink = Math.sin(T*8)*0.5 + 0.5;
      ctx.globalAlpha = 0.25 + blink*0.4;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,55);
      grad.addColorStop(0, 'rgba(255,150,50,0.5)');
      grad.addColorStop(1, 'rgba(255,150,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,55,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}

  for(const a of G.allies){
    const def = ALLIES_DEF.find(d=>d.id===a.id);

    const hoverDist = dist(mouse.x + G.camera.x, mouse.y + G.camera.y, a.x, a.y);
    const isHover = hoverDist < 26;
    const pulse = 0.5 + 0.5*Math.sin(T*3 + a.x*0.01);

    // свечение
    const gr = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, isHover?50:34);
    gr.addColorStop(0, a.color + (isHover?'88':'55'));
    gr.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath(); ctx.arc(a.x, a.y, isHover?50:34, 0, TAU); ctx.fill();

      rr(ctx, dx, dy, dw, dh, 5); ctx.stroke();
      ctx.fillStyle = a.color;
      ctx.font = '700 11px "Segoe UI","Roboto",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(a.name, a.x, dy + 12);
      ctx.fillStyle = 'rgba(180,210,230,0.85)';
      ctx.font = '10px "Segoe UI","Roboto",system-ui,sans-serif';
      ctx.fillText(a.met ? 'уже знакомы' : 'нажмите чтобы познакомиться', a.x, dy + 26);
    }
  }
}

function drawFloatingArtifacts(){
  const G = game;
  if(!G) return;
  for(const a of G.floatingArtifacts){
    const def = ARTIFACT_TYPES[a.type];
    if(!def) continue;
    const yOff = Math.sin(a.anim*3)*5;
    const x = a.x, y = a.y + yOff;

    const grad = ctx.createRadialGradient(x, y, 0, x, y, 26);
    grad.addColorStop(0, def.color + '99');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, 26, 0, TAU); ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a.anim*0.8);
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const ang = i/6*TAU;
      const px = Math.cos(ang)*11, py = Math.sin(ang)*11;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = def.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#0a1420';
    ctx.font = 'bold 11px "Segoe UI","Roboto",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.glyph, x, y+1);
  }
}

function drawFloatingTexts(){
  const G = game;
  if(!G) return;
  for(const f of G.floatingTexts){
    const alpha = clamp(f.life / f.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 13px "Segoe UI","Roboto",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // фон
    const w = ctx.measureText(f.text).width + 20;
    ctx.fillStyle = 'rgba(6,14,22,0.85)';
    rr(ctx, f.x - w/2, f.y - 11, w, 22, 4); ctx.fill();
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 1;
    rr(ctx, f.x - w/2, f.y - 11, w, 22, 4); ctx.stroke();
    // текст
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

function drawTrapsAndTurrets(){
  const G = game;
  if(!G) return;
  for(const t of G.turrets){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.ellipse(t.x+2, t.y+6, 12, 5, 0, 0, TAU); ctx.fill();
    ctx.translate(t.x, t.y);
    ctx.fillStyle = '#1a2634';
    ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.fill();
    ctx.strokeStyle = '#5ad1ff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.stroke();
    ctx.rotate(t.angle);
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(5,-3,18,6);
    ctx.fillStyle = '#7fe9ff';
    ctx.fillRect(20,-2,5,4);
    ctx.fillStyle = 'rgba(90,209,255,'+(0.6+0.4*Math.sin(T*6))+')';
    ctx.beginPath(); ctx.arc(0,0,3.5,0,TAU); ctx.fill();
    ctx.restore();
  }
  for(const l of G.lasers){
    const gd = GATE_DATA[l.gateId];
    const r = ROOMS[l.gateId];
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(T*6 + gd.cx);
    ctx.strokeStyle = '#ff4a9a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(r.x+10, gd.cy); ctx.lineTo(r.x+r.w-10, gd.cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gd.cx, r.y+10); ctx.lineTo(gd.cx, r.y+r.h-10);
    ctx.stroke();
    ctx.restore();
  }
  if(G.blocker){
    for(const id of GATE_IDS){
      const r = ROOMS[id];
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.10*Math.sin(T*4.5);
      ctx.fillStyle = '#5affd0';
      rr(ctx, r.x, r.y, r.w, r.h, 8); ctx.fill();
      ctx.restore();
    }
  }
}

function drawEnemy(e){
  const flash = e.flash > 0;
  const alpha = e.cloaked ? 0.15 : 1;
  const s = e.size;

  if(!e.cloaked){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + s*0.85, s*0.9, s*0.35, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  if(!e.cloaked && e.type !== 'stealth'){
    const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, s*2.4);
    grad.addColorStop(0, e.color + '55');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(e.x, e.y, s*2.4, 0, TAU); ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(e.x, e.y);

  if(e.type === 'parasite'){
    ctx.rotate(e.angle);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.moveTo(s, 0); ctx.lineTo(-s*0.75, s*0.7);
    ctx.lineTo(-s*0.35, 0); ctx.lineTo(-s*0.75, -s*0.7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = flash ? '#ffffff' : '#2a5a2a';
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = flash ? '#ffffff' : e.color;
    ctx.lineWidth = 1.4;
    const w = Math.sin(e.anim*14)*3;
    ctx.beginPath();
    ctx.moveTo(-s*0.2, s*0.5); ctx.lineTo(-s*0.9, s*0.95+w);
    ctx.moveTo(-s*0.2,-s*0.5); ctx.lineTo(-s*0.9,-s*0.95-w);
    ctx.stroke();
    ctx.fillStyle = '#0a1a0a';
    ctx.beginPath(); ctx.arc(s*0.5, s*0.2, s*0.15, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.5, -s*0.2, s*0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#3bff9e';
    ctx.beginPath(); ctx.arc(s*0.55, s*0.2, s*0.08, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.55, -s*0.2, s*0.08, 0, TAU); ctx.fill();
  }
  else if(e.type === 'drone'){
    ctx.rotate(e.anim*0.9);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = i/6*TAU;
      const px = Math.cos(a)*s, py = Math.sin(a)*s;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1808'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.strokeStyle = flash ? '#ffffff' : '#2a1c0c';
    ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      const a = i/3*TAU + e.anim*2;
      const px = Math.cos(a)*s*0.5, py = Math.sin(a)*s*0.5;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px + Math.cos(a+0.3)*4, py + Math.sin(a+0.3)*4);
      ctx.stroke();
    }
    ctx.fillStyle = '#2a1c0c';
    ctx.beginPath(); ctx.arc(0,0,s*0.28,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff5a5a';
    ctx.beginPath(); ctx.arc(0,0,s*0.15,0,TAU); ctx.fill();
  }
  else if(e.type === 'stealth'){
    ctx.rotate(e.anim*1.6);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.moveTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.lineTo(0,-s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = flash ? '#ffffff' : 'rgba(200,160,255,0.8)';
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*1.5,e.anim*3, e.anim*3+2.1); ctx.stroke();
    ctx.fillStyle = flash ? '#ffffff' : '#5a2a8a';
    ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff8ad8';
    ctx.beginPath(); ctx.arc(0,0,s*0.1,0,TAU); ctx.fill();
  }
  else if(e.type === 'brute'){
    ctx.rotate(e.anim*0.5);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath(); ctx.arc(0,0,s,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(20,8,8,0.7)';
    for(let i=0;i<6;i++){
      const a = i/6*TAU;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(-4,-s-2); ctx.lineTo(4,-s-2); ctx.lineTo(0,-s-9);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#2a0c0c';
    ctx.beginPath(); ctx.arc(0,0,s*0.4,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff3b3b';
    ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
  }
  else if(e.type === 'crawler'){
    ctx.rotate(e.angle);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, s*1.1, s*0.65, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = flash ? '#ffffff' : e.color;
    ctx.lineWidth = 1.3;
    for(let i=-1;i<=1;i++){
      const ph = Math.sin(e.anim*18 + i*1.2)*3;
      ctx.beginPath();
      ctx.moveTo(-s*0.3, i*s*0.4);
      ctx.lineTo(-s*0.8, i*s*0.5 + ph);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.3, i*s*0.4);
      ctx.lineTo(s*0.8, i*s*0.5 + ph);
      ctx.stroke();
    }
    ctx.fillStyle = '#7a3010';
    ctx.beginPath(); ctx.arc(s*0.9, 0, s*0.35, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath(); ctx.arc(s*0.9, 0, s*0.15, 0, TAU); ctx.fill();
  }
  else if(e.type === 'shooter'){
    ctx.rotate(e.anim*0.7);
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a = i/8*TAU;
      const r = i%2 === 0 ? s : s*0.6;
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a1a3a';
    ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#3a0a2a';
    ctx.beginPath(); ctx.arc(0,0,s*0.4,0,TAU); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#ff8aff';
    ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
    ctx.fillStyle = '#3a1a3a';
    ctx.fillRect(s*0.8, -2, 6, 4);
    ctx.fillRect(-s*0.8-6, -2, 6, 4);
  }
  ctx.restore();

  if(!e.cloaked && (e.hp < e.maxHp || (game && game.upgrades.scanner))){
    const w = Math.max(18, e.size*2.6);
    const x = e.x - w/2, y = e.y - e.size - 12;
    const p = clamp(e.hp/e.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x-1, y-1, w+2, 5);
    ctx.fillStyle = p > 0.6 ? '#3bff9e' : (p > 0.3 ? '#ffcf4a' : '#ff3b3b');
    ctx.fillRect(x, y, w*p, 3);
  }
}

function drawEnemies(){
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active) continue;
    drawEnemy(e);
  }
}

function drawProjectiles(){
  for(let i=0;i<projPool.length;i++){
    const p = projPool[i];
    if(!p.active) continue;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*4);
    grad.addColorStop(0, p.color + '88');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*4, 0, TAU); ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*0.5, 0, TAU); ctx.fill();
  }
}

function drawBeams(){
  ctx.save();
  ctx.lineCap = 'round';
  for(let i=0;i<beamPool.length;i++){
    const b = beamPool[i];
    if(!b.active) continue;
    const a = clamp(b.life/b.maxLife, 0, 1);
    ctx.globalAlpha = a*0.95;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.width*a + 0.6;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.globalAlpha = a*0.5;
    ctx.lineWidth = b.width*a*2.4 + 1;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(){
  ctx.save();
  for(let i=0;i<particlePool.length;i++){
    const p = particlePool[i];
    if(!p.active) continue;
    const a = clamp(p.life/p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if(p.glow){
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*2);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*2, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = p.color;
    const s = p.size*a;
    if(p.shape === 0){
      ctx.fillRect(p.x - s*0.5, p.y - s*0.5, s, s);
    } else if(p.shape === 1){
      ctx.beginPath(); ctx.arc(p.x, p.y, s*0.6, 0, TAU); ctx.fill();
    } else if(p.shape === 2){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-s, -s*0.2, s*2, s*0.4);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawPanel(x,y,w,h,title){
  ctx.fillStyle = 'rgba(6,12,20,0.92)';
  rr(ctx,x,y,w,h,6); ctx.fill();
  ctx.strokeStyle = 'rgba(58,130,175,0.55)';
  ctx.lineWidth = 1;
  rr(ctx,x,y,w,h,6); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,200,255,0.75)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+4, y+14); ctx.lineTo(x+4, y+4); ctx.lineTo(x+18, y+4);
  ctx.moveTo(x+w-18, y+h-4); ctx.lineTo(x+w-4, y+h-4); ctx.lineTo(x+w-4, y+h-14);
  ctx.stroke();
  if(title) txt(title, x+14, y+16, 12, 'rgba(130,215,250,0.95)', 'left', 'bold');

function drawBar(x,y,w,h,val,max,color,label,showVal){
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(x,y,w,h);
  const p = clamp(val/max, 0, 1);
  ctx.fillStyle = color;
  ctx.fillRect(x,y,w*p,h);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x,y,w*p,h*0.35);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);
  if(label) txt(label, x, y-8, 10, 'rgba(160,200,225,0.95)');
  if(showVal) txt(Math.round(val)+'%', x+w, y-8, 10, 'rgba(210,235,250,0.95)', 'right', 'bold');
}

function drawMinimap(){
  const G = game;
  if(!G) return;
  const mw = 240, mh = 156, mx = VIEW_W - mw - 12, my = VIEW_H - mh - 72;
  ctx.fillStyle = 'rgba(6,12,20,0.85)';
  rr(ctx, mx, my, mw, mh, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(90,180,220,0.6)';
  ctx.lineWidth = 1.2;
  rr(ctx, mx, my, mw, mh, 5); ctx.stroke();

  const sx = mw / WORLD_W;
  const sy = mh / WORLD_H;

  // комнаты
  for(const id in ROOMS){
    const r = ROOMS[id];
    const col = roomStatusColor(id);
    ctx.fillStyle = 'rgba(20,40,55,0.85)';
    ctx.fillRect(mx + r.x*sx, my + r.y*sy, r.w*sx, r.h*sy);
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.strokeRect(mx + r.x*sx+0.5, my + r.y*sy+0.5, r.w*sx-1, r.h*sy-1);
  }

  // игрок
  const px = mx + G.player.x*sx;
  const py = my + G.player.y*sy;
  ctx.fillStyle = '#5ad1ff';
  ctx.beginPath(); ctx.arc(px, py, 3.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(90,209,255,0.9)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(G.player.angle)*7, py + Math.sin(G.player.angle)*7);
  ctx.stroke();

  // враги
  for(let i=0;i<enemyPool.length;i++){
    const e = enemyPool[i];
    if(!e.active || e.cloaked) continue;
    ctx.fillStyle = e.color;
    ctx.fillRect(mx + e.x*sx - 1, my + e.y*sy - 1, 2, 2);
  }

  // союзники
  for(const a of G.allies){
    ctx.fillStyle = a.met ? a.color : 'rgba(255,220,80,0.95)';
    ctx.beginPath(); ctx.arc(mx + a.x*sx, my + a.y*sy, 2.5, 0, TAU); ctx.fill();
  }

  // рамка камеры
  ctx.strokeStyle = 'rgba(120,220,255,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx + G.camera.x*sx, my + G.camera.y*sy, VIEW_W*sx, VIEW_H*sy);
}

    ctx.lineWidth = 1.3;

    addZone(x,y,w,h,fn);
  };

  abtn(lx+12, ly+200, lw-24, 30, 'РЕМОНТ [R] -30Э', repairGates, G.energy>=30 && G.repairCd<=0);
  abtn(lx+12, ly+236, lw-24, 30, 'КИСЛОРОД [F] -16Э', boostOxygen, G.energy>=16 && G.oxygenCd<=0);
  abtn(lx+12, ly+272, lw-24, 30, 'ПЕРЕЗАГРУЗКА [SPACE]', rebootEnergy, G.rebootCd<=0);

  // Нижняя панель оружия
  ctx.fillStyle = 'rgba(5,10,16,0.92)';
  ctx.fillRect(0, VIEW_H-56, VIEW_W, 56);

  ctx.beginPath(); ctx.moveTo(0, VIEW_H-56.5); ctx.lineTo(VIEW_W, VIEW_H-56.5); ctx.stroke();

  for(let i=0;i<WEAPONS.length;i++){
    const w = WEAPONS[i];
    const x = 20 + i*188, y = VIEW_H - 50, ww = 178, hh = 44;
    const unlocked = G.unlocked[i];
    const active = G.weapon === i;
    const hv = inRect(mouse.x,mouse.y,x,y,ww,hh);

    ctx.fillStyle = active ? 'rgba(25,60,85,0.98)' : (unlocked ? (hv?'rgba(18,36,52,0.98)':'rgba(10,20,30,0.95)') : 'rgba(14,14,18,0.9)');
    rr(ctx,x,y,ww,hh,4); ctx.fill();
    ctx.strokeStyle = active ? 'rgba(120,225,255,1)' : (unlocked?'rgba(60,120,160,0.7)':'rgba(60,60,70,0.5)');

    rr(ctx,x,y,ww,hh,4); ctx.stroke();

    ctx.fillStyle = unlocked ? w.color : '#404450';
    ctx.fillRect(x+8, y+10, 4, 26);

    txt(w.name, x+20, y+16, 12, unlocked?(active?'#d8f4ff':'#a8cfe6'):'#50555f', 'left', 'bold');

        unlocked?'rgba(140,180,205,0.9)':'#4a4f58');

    if(active && G.fireCd > 0){

      ctx.fillStyle = 'rgba(120,225,255,0.55)';
      ctx.fillRect(x+2, y+hh-4, (ww-4)*p, 2);

      if(unlocked){ G.weapon = i; Snd.click(); }

  txt('WASD — движение   ЛКМ — огонь   Q/E — оружие   1-8 — камеры   B — магазин   ESC — пауза',
      VIEW_W-20, VIEW_H-20, 11, 'rgba(140,180,205,0.8)', 'right');

  // Красный флеш
  if(G.flashRed > 0){

    ctx.fillRect(0,0,VIEW_W,VIEW_H);

  drawMinimap();
}

function drawTutorial(){
  const G = game;
  if(!G || !G.tutorial.active || G.tutorial.done) return;

  const step = TUT_STEPS[G.tutorial.step];
  if(!step) return;

  const panelW = 620, panelH = 110;
  const px = (VIEW_W - panelW)/2;
  const py = 130;

  const pulse = 0.5 + 0.5*Math.sin(T*4);

  ctx.save();
  // фон
  ctx.fillStyle = 'rgba(6,18,28,0.94)';
  rr(ctx, px, py, panelW, panelH, 8); ctx.fill();
  // рамка с пульсацией
  ctx.strokeStyle = 'rgba(120,220,255,' + (0.6 + 0.4*pulse) + ')';
  ctx.lineWidth = 2.5;
  rr(ctx, px, py, panelW, panelH, 8); ctx.stroke();
  // тень
  ctx.shadowColor = 'rgba(90,209,255,0.6)';
  ctx.shadowBlur = 20;
  ctx.strokeStyle = 'rgba(120,220,255,0.4)';
  ctx.lineWidth = 1;
  rr(ctx, px, py, panelW, panelH, 8); ctx.stroke();
  ctx.restore();

  // Индикатор шага
  txt('ОБУЧЕНИЕ  ' + (G.tutorial.step+1) + ' / ' + TUT_STEPS.length,
      px+24, py+24, 13, 'rgba(140,220,255,0.9)', 'left', 'bold');

  // Прогресс
  const barW = 200, barH = 5;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(px+panelW-barW-24, py+22, barW, barH);
  ctx.fillStyle = '#5ad1ff';
  ctx.fillRect(px+panelW-barW-24, py+22, barW*(G.tutorial.step/TUT_STEPS.length), barH);

  // Инструкция
  txtGrad(step.text, px+panelW/2, py+62, 20, '#d8f4ff', '#7fe9ff', 'center');

  // Подсказка
  txt('Выполни действие — и обучение продолжится', px+panelW/2, py+90, 12, 'rgba(160,200,225,0.85)', 'center');
}

function renderGame(){
  const G = game;
  if(!G) return;

  const shakeX = G.shake > 0 ? rnd(-G.shake, G.shake) : 0;
  const shakeY = G.shake > 0 ? rnd(-G.shake, G.shake) : 0;

  ctx.save();
  ctx.translate(-G.camera.x + shakeX, -G.camera.y + shakeY);

  // фон
  ctx.drawImage(bgCanvas, 0, 0);

  // динамика мира
  drawWorldLayer();
  drawCore();
  drawTrapsAndTurrets();
  drawAllies();
  drawFloatingArtifacts();
  drawEnemies();
  drawProjectiles();
  drawBeams();
  drawPlayer();
  drawParticles();
  drawFloatingTexts();

  ctx.restore();

  drawHUD();
  drawTutorial();

  if(settings.crt) drawCRTOverlay(0.25);
}

function drawMenuBackground(){
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  ctx.save();
  for(let i=0;i<6;i++){
    const x = 130 + i*190;
    const y = 150 + (i%3)*180;
    let flick = 0.55 + 0.35*Math.sin(menuT*2.3 + i*2.1);
    if(Math.random() < 0.012) flick *= 0.15;
    ctx.globalAlpha = flick;
    ctx.drawImage(lightCanvas, x-160, y-160, 320, 320);
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(40,110,150,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0;i<26;i++){
    const x = i*(VIEW_W/25);
    ctx.moveTo(x, VIEW_H);
    ctx.lineTo(VIEW_W/2 + (x-VIEW_W/2)*0.15, 320);
  }
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(35,80,110,0.14)';
  ctx.beginPath();
  for(let x=0;x<=VIEW_W;x+=48){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,VIEW_H); }
  for(let y=0;y<=VIEW_H;y+=48){ ctx.moveTo(0,y+0.5); ctx.lineTo(VIEW_W,y+0.5); }
  ctx.stroke();
  ctx.restore();
}

    settings.gamma = clamp(0.5 + ((mouse.x-volX)/volW)*1.0, 0.5, 1.5);

function renderShop(){
  const G = game;
  ctx.fillStyle = 'rgba(3,7,12,0.94)';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  txtGrad('АРСЕНАЛ И МАГАЗИН', 60, 50, 26, '#d8f4ff', '#5ad1ff', 'left');
  txt('КРЕДИТЫ: $ ' + Math.floor(G.credits), 60, 82, 16, '#8dffb0', 'left', 'bold');
  txt('СМЕНА ' + G.clock + '  •  ' + formatTime(G.time), 400, 82, 13,
      'rgba(160,200,225,0.9)');

  const cw = 190, ch = 40, cx = VIEW_W-60-cw, cy = 32;
  const chv = inRect(mouse.x,mouse.y,cx,cy,cw,ch);
  ctx.fillStyle = chv?'rgba(30,60,85,0.98)':'rgba(14,26,38,0.95)';
  rr(ctx,cx,cy,cw,ch,4); ctx.fill();
  ctx.strokeStyle = chv?'rgba(120,225,255,0.95)':'rgba(70,130,170,0.7)';
  ctx.lineWidth = 1.4; rr(ctx,cx,cy,cw,ch,4); ctx.stroke();
  txt('ЗАКРЫТЬ [ESC]', cx+cw/2, cy+ch/2+1, 13, chv?'#dcf6ff':'#9fd0e8', 'center', 'bold');
  addZone(cx,cy,cw,ch,()=>{ Snd.click(); screen='game'; });

  const items = getShopItems();
  const cols = 4, cardW = 275, cardH = 120, gapX = 20, gapY = 15;
  const startX = 60, startY = 110;

  for(let i=0;i<items.length;i++){
    const it = items[i];
    const col = i % cols, row = Math.floor(i/cols);
    const x = startX + col*(cardW+gapX);
    const y = startY + row*(cardH+gapY);

    const canBuy = !it.owned && G.credits >= it.price;
    const hv = inRect(mouse.x,mouse.y,x,y,cardW,cardH);

    ctx.fillStyle = it.owned ? 'rgba(16,38,28,0.92)'
                  : (canBuy ? (hv?'rgba(22,52,76,0.96)':'rgba(12,24,36,0.94)')
                            : 'rgba(14,16,20,0.92)');
    rr(ctx,x,y,cardW,cardH,5); ctx.fill();
    ctx.strokeStyle = it.owned ? 'rgba(80,220,140,0.65)'
                    : (canBuy ? (hv?'rgba(120,225,255,0.95)':'rgba(60,130,175,0.7)')
                              : 'rgba(60,62,70,0.6)');
    ctx.lineWidth = hv && canBuy ? 1.8 : 1.2;
    rr(ctx,x,y,cardW,cardH,5); ctx.stroke();

    txt(it.cat, x+14, y+18, 10, 'rgba(120,180,215,0.85)', 'left', 'bold');
    txt(it.name, x+14, y+42, 14, it.owned?'#8dffb0':(canBuy?'#dcf6ff':'#6a7078'), 'left', 'bold');
    txt(it.sub, x+14, y+62, 11, 'rgba(150,190,215,0.85)');

    const bw = cardW-28, bh = 30, bx = x+14, by = y+cardH-42;
    if(it.owned){
      ctx.fillStyle = 'rgba(30,70,50,0.9)';
      rr(ctx,bx,by,bw,bh,4); ctx.fill();
      ctx.strokeStyle = 'rgba(80,220,140,0.6)';
      ctx.lineWidth = 1.2; rr(ctx,bx,by,bw,bh,4); ctx.stroke();
      txt('УСТАНОВЛЕНО', bx+bw/2, by+bh/2+1, 12, '#8dffb0', 'center', 'bold');
    } else {
      const affordable = G.credits >= it.price;
      ctx.fillStyle = affordable ? (hv?'rgba(40,110,70,0.98)':'rgba(20,56,38,0.95)') : 'rgba(26,26,30,0.9)';
      rr(ctx,bx,by,bw,bh,4); ctx.fill();
      ctx.strokeStyle = affordable ? (hv?'rgba(110,255,180,0.95)':'rgba(60,160,110,0.7)') : 'rgba(70,70,78,0.6)';
      ctx.lineWidth = 1.3; rr(ctx,bx,by,bw,bh,4); ctx.stroke();
      txt('$ ' + it.price, bx+bw/2, by+bh/2+1, 14, affordable?'#8dffb0':'#5a6068', 'center', 'bold');
      if(affordable) addZone(bx,by,bw,bh,()=>{ it.buy(); });
    }
  }

  if(settings.crt) drawCRTOverlay(0.3);
}

function renderDialog(){
  const G = game;
  if(!G || !G.dialog) return;
  renderGame();

  ctx.fillStyle = 'rgba(3,7,12,0.8)';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  const d = G.dialog;
  const px = VIEW_W/2 - 460, py = VIEW_H/2 - 200, pw = 920, ph = 400;
  drawPanel(px, py, pw, ph, 'РАЗГОВОР • ' + d.def.name);

  // портрет
  const allyX = px+110, allyY = py+ph/2;
  ctx.fillStyle = 'rgba(10,20,30,0.95)';
  rr(ctx, px+40, py+40, 140, 280, 8); ctx.fill();
  ctx.strokeStyle = d.def.color + '90';
  ctx.lineWidth = 2.5;
  rr(ctx, px+40, py+40, 140, 280, 8); ctx.stroke();

  ctx.save();
  ctx.translate(allyX, allyY);
  ctx.scale(4, 4);

  if(d.def.id === 'gryus'){
    // Грюс в портрете
    ctx.fillStyle = 'rgba(90,70,55,0.95)';
    ctx.beginPath();
    ctx.moveTo(-7, -6); ctx.lineTo(7, -6); ctx.lineTo(6, 8);
    ctx.lineTo(2, 5); ctx.lineTo(-2, 10); ctx.lineTo(-6, 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(140,30,30,0.75)';
    ctx.beginPath(); ctx.arc(-3, 3, 2.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -1, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c8b0a0';
    ctx.beginPath(); ctx.arc(0, -12, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff3b3b';
    ctx.beginPath(); ctx.arc(3, -12, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(80,30,30,0.8)';
    ctx.beginPath(); ctx.arc(-3, -12, 2, 0, TAU); ctx.fill();
    // электричество
    for(let i=0;i<3;i++){
      const a = T*5 + i*2.1;
      ctx.strokeStyle = 'rgba(150,220,255,'+(0.4+0.4*Math.sin(T*12+i))+')';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*10, Math.sin(a)*10);
      ctx.lineTo(Math.cos(a)*16, Math.sin(a)*16);
      ctx.stroke();
    }
  } else {
    // обычный NPC
    let bodyColor = '#2a3a4a';
    if(d.def.id === 'engineer') bodyColor = '#5a4520';
    else if(d.def.id === 'scientist') bodyColor = '#2a4a5a';
    else if(d.def.id === 'medic') bodyColor = '#2a5a3a';
    ctx.fillStyle = '#1a2634';
    ctx.fillRect(-7, 4, 6, 9);
    ctx.fillRect(1, 4, 6, 9);
    ctx.fillStyle = bodyColor;
    rr(ctx, -8, -8, 16, 13, 3); ctx.fill();
    ctx.fillStyle = d.def.color;
    ctx.fillRect(-7, -5, 14, 3);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-10, -5, 3, 8);
    ctx.fillRect(7, -5, 3, 8);
    ctx.fillStyle = '#d4b090';
    ctx.beginPath(); ctx.arc(0, -12, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = d.def.color;
    ctx.beginPath(); ctx.arc(0, -12, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-2, -12, 1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(2, -12, 1, 0, TAU); ctx.fill();
  }
  ctx.restore();

  txt(d.def.short, allyX, py+ph-20, 13, d.def.color, 'center', 'bold');
  txt(d.def.desc, allyX, py+ph-4, 10, 'rgba(150,190,215,0.85)', 'center');

  // текст
  const textX = px+210, textY = py+90;
  const line = d.def.dialogs[d.page];
  const words = line.split(' ');
  let lineY = textY;
  let curLine = '';
  const maxW = pw-260;
  ctx.font = '700 16px "Segoe UI","Roboto",system-ui,sans-serif';
  for(const w of words){
    const test = curLine ? curLine+' '+w : w;
    if(ctx.measureText(test).width > maxW){
      txt(curLine, textX, lineY, 16, '#e0f4ff', 'left', 'bold');
      lineY += 30;
      curLine = w;
    } else { curLine = test; }
  }
  if(curLine) txt(curLine, textX, lineY, 16, '#e0f4ff', 'left', 'bold');

  // индикатор
  txt((d.page+1) + ' / ' + d.def.dialogs.length, textX, py+ph-70, 12, 'rgba(140,190,220,0.8)', 'left', 'bold');

  const bw = 220, bh = 44, bx = px+pw-bw-30, by = py+ph-bh-24;
  const hv = inRect(mouse.x,mouse.y,bx,by,bw,bh);
  ctx.fillStyle = hv?'rgba(30,90,60,0.98)':'rgba(14,36,26,0.95)';
  rr(ctx,bx,by,bw,bh,4); ctx.fill();
  ctx.strokeStyle = hv?'rgba(110,255,180,0.95)':'rgba(60,160,110,0.7)';
  ctx.lineWidth = 1.4; rr(ctx,bx,by,bw,bh,4); ctx.stroke();
  const isLast = d.page >= d.def.dialogs.length-1;
  txt(isLast?'ЗАКОНЧИТЬ':'ДАЛЕЕ', bx+bw/2, by+bh/2+1, 14, hv?'#d8ffe8':'#8ee0b0', 'center', 'bold');
  addZone(bx,by,bw,bh,()=>{ advanceDialog(); });

  if(settings.crt) drawCRTOverlay(0.3);
}

    ['ПОТРАЧЕНО ЭНЕРГИИ', Math.round(G.stats.energySpent) + ' кВт'],
    ['КУПЛЕНО УЛУЧШЕНИЙ', String(G.stats.upgradesBought)],
    ['АРТЕФАКТОВ СОБРАНО', String(G.artifacts.length) + ' (апгрейдов: ' + G.artifacts.filter(a=>a.endsWith('_up')).length + ')'],
    ['СОЮЗНИКОВ ВСТРЕЧЕНО', String(G.allies.filter(a=>a.met).length) + ' / ' + G.allies.length],
    ['ЗАРАБОТАНО', '$ ' + Math.floor(G.stats.spent + G.credits)]
  ];
  let y = py+52;
  for(const r of rows){
    txt(r[0], px+40, y, 13, 'rgba(160,200,225,0.95)');
    txt(r[1], px+pw-40, y, 14, '#bde8ff', 'right', 'bold');
    y += 34;
  }

  if(G.mode === 'endless'){
    txtGrad('ЛИЧНЫЙ РЕКОРД: ' + formatTime(bestRecord()), VIEW_W/2, py+ph+30, 16, '#d8ffe8', '#8dffb0', 'center');
  }

  const bw = 240, bh = 48;
  const b1x = VIEW_W/2 - bw - 12, b2x = VIEW_W/2 + 12, by = 600;

  let hv = inRect(mouse.x,mouse.y,b1x,by,bw,bh);
  ctx.fillStyle = hv?'rgba(30,90,60,0.98)':'rgba(14,36,26,0.95)';
  rr(ctx,b1x,by,bw,bh,4); ctx.fill();
  ctx.strokeStyle = hv?'rgba(110,255,180,0.95)':'rgba(60,160,110,0.7)';
  ctx.lineWidth = 1.4; rr(ctx,b1x,by,bw,bh,4); ctx.stroke();
  txt('НОВАЯ СМЕНА', b1x+bw/2, by+bh/2+1, 15, hv?'#d8ffe8':'#8ee0b0', 'center', 'bold');
  addZone(b1x,by,bw,bh,()=>{ Snd.click(); startGame(G.mode); });

  hv = inRect(mouse.x,mouse.y,b2x,by,bw,bh);
  ctx.fillStyle = hv?'rgba(24,50,70,0.98)':'rgba(10,20,30,0.9)';
  rr(ctx,b2x,by,bw,bh,4); ctx.fill();
  ctx.strokeStyle = hv?'rgba(120,225,255,0.9)':'rgba(60,120,160,0.7)';
  ctx.lineWidth = 1.4; rr(ctx,b2x,by,bw,bh,4); ctx.stroke();
  txt('В МЕНЮ', b2x+bw/2, by+bh/2+1, 15, hv?'#dcf6ff':'#9fcde6', 'center', 'bold');
  addZone(b2x,by,bw,bh,()=>{ Snd.click(); game = null; screen='menu'; });

  if(settings.crt) drawCRTOverlay(0.45);
}

/* ============================================================
   ГЛАВНЫЙ РЕНДЕР
   ============================================================ */
function render(){
  zones.length = 0;
  ctx.imageSmoothingEnabled = true;

  if(screen === 'game'){ renderGame(); }
  else if(screen === 'menu'){ renderMenu(); }
  else if(screen === 'modes'){ renderModes(); }
  else if(screen === 'settings'){ renderSettings(); }
  else if(screen === 'help'){ renderHelp(); }
  else if(screen === 'pause'){ renderGame(); renderPauseOverlay(); }
  else if(screen === 'shop'){ renderGame(); renderShop(); }
  else if(screen === 'dialog'){ renderDialog(); }
  else if(screen === 'over' || screen === 'victory'){ renderEndScreen(screen === 'victory'); }
}

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
function update(dt){
  menuT += dt;
  noiseTick++;
  if(noiseTick % 3 === 0) updateNoise();

  if(screen === 'game'){
    updateGame(dt);
    updateEffects(dt);
  } else if(screen === 'dialog'){
    updateEffects(dt);
    // бормотание NPC
    if(game && game.dialog){
      if(!game.dialog.mumbleT) game.dialog.mumbleT = 0;
      game.dialog.mumbleT -= dt;
      if(game.dialog.mumbleT <= 0){
        game.dialog.mumbleT = rnd(0.22, 0.42);
        Snd.mumble();
      }
    }
  }
}

/* ============================================================
   ВВОД
   ============================================================ */
function updateMouse(e){
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (VIEW_W / r.width);
  mouse.y = (e.clientY - r.top) * (VIEW_H / r.height);
}

canvas.addEventListener('mousemove', updateMouse);

canvas.addEventListener('mousedown', function(e){
  if(e.button !== 0) return;
  Snd.init();
  updateMouse(e);
  mouseDown = true;
  const z = hitTest(mouse.x, mouse.y);
  if(z){ z.fn(); return; }
  if(screen === 'game' && game){
    const wmx = mouse.x + game.camera.x;
    const wmy = mouse.y + game.camera.y;

    // клик по союзнику
    for(const a of game.allies){
      if(dist(wmx, wmy, a.x, a.y) < 28){
        openDialog(a.id);
        return;
      }
    }
    // клик по артефакту
    for(let i=game.floatingArtifacts.length-1; i>=0; i--){
      const a = game.floatingArtifacts[i];
      if(dist(wmx, wmy, a.x, a.y) < 22){
        const res = addArtifact(game, a.type);
        if(res === true){
          game.stats.artifactsCollected++;
          Snd.artifact();
          burst(a.x, a.y, 20, ARTIFACT_TYPES[a.type].color, 160, 3, 1, true, 20);
          game.tutorial.flags.artifact = true;
        } else if(res === 'upgrade'){
          game.stats.artifactsCollected++;
          game.stats.artifactsUpgraded++;
          Snd.artifactUp();
          burst(a.x, a.y, 30, ARTIFACT_TYPES[a.type].color, 200, 3.5, 1, true, 20);
          game.floatingTexts.push({ x:a.x, y:a.y-30, life:2.5, maxLife:2.5,
            text:'АПГРЕЙД АРТЕФАКТА!', color:'#ffe88a' });
          game.tutorial.flags.artifact = true;
        } else {
          Snd.err();
          return;
        }
        game.floatingArtifacts.splice(i,1);
        return;
      }
    }

    fireAt(wmx, wmy);
  }
});

window.addEventListener('mouseup', function(){ mouseDown = false; });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  if(e.touches.length === 0) return;
  Snd.init();
  const t = e.touches[0];
  updateMouse(t);
  const z = hitTest(mouse.x, mouse.y);
  if(z){ z.fn(); return; }
  if(screen === 'game' && game){
    const wmx = mouse.x + game.camera.x;
    const wmy = mouse.y + game.camera.y;
    for(const a of game.allies){
      if(dist(wmx, wmy, a.x, a.y) < 32){ openDialog(a.id); return; }
    }
    for(let i=game.floatingArtifacts.length-1; i>=0; i--){
      const a = game.floatingArtifacts[i];
      if(dist(wmx, wmy, a.x, a.y) < 28){
        const res = addArtifact(game, a.type);
        if(res){ game.stats.artifactsCollected++; Snd.artifact(); }
        game.floatingArtifacts.splice(i,1);
        return;
      }
    }
    fireAt(wmx, wmy);
  }
}, {passive:false});

canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  if(e.touches.length === 0) return;
  updateMouse(e.touches[0]);
}, {passive:false});

window.addEventListener('keydown', function(e){
  Snd.init();
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;

  if(screen === 'game' && game){
    if(e.key >= '1' && e.key <= '8'){
      game.sector = parseInt(e.key,10) - 1;
      game.tutorial.flags.sector = true;
      Snd.click();
      return;
    }
    if(e.code === 'Space'){ e.preventDefault(); rebootEnergy(); return; }
    if(e.key === 'q' || e.key === 'Q' || e.key === 'й' || e.key === 'Й'){ cycleWeapon(-1); return; }
    if(e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У'){ cycleWeapon(1); return; }
    if(e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К'){ repairGates(); return; }
    if(e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А'){ boostOxygen(); return; }
    if(e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И'){ screen = 'shop'; game.tutorial.flags.shop = true; Snd.click(); return; }
    if(e.key === 'Escape'){ screen = 'pause'; Snd.click(); return; }
  }
  else if(screen === 'pause' || screen === 'shop'){
    if(e.key === 'Escape'){ screen = 'game'; Snd.click(); }
  }
  else if(screen === 'dialog'){
    if(e.key === 'Escape' || e.code === 'Space'){ e.preventDefault(); advanceDialog(); }
  }
  else if(screen === 'modes' || screen === 'settings' || screen === 'help'){
    if(e.key === 'Escape'){ screen = 'menu'; Snd.click(); }
  }
});

window.addEventListener('keyup', function(e){
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});

/* ============================================================
   МАСШТАБИРОВАНИЕ И ЦИКЛ
   ============================================================ */
function resize(){
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  const w = Math.floor(VIEW_W * s), h = Math.floor(VIEW_H * s);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.left = Math.floor((window.innerWidth - w)/2) + 'px';
  canvas.style.top = Math.floor((window.innerHeight - h)/2) + 'px';
}
window.addEventListener('resize', resize);

buildBackground();
resize();
updateNoise();
applyGamma();

let lastT = performance.now();
function loop(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.1) dt = 0.1;
  if(dt < 0) dt = 0;
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
